/* Stage 3A review v2: scroll the form, not the entire popup. */
.dialog{
    max-height:calc(100vh - 40px);
    max-height:calc(100dvh - 40px);
    min-height:0;
}
.dialog-header,.dialog-foot{flex:0 0 auto}
.dialog form{
    display:flex;
    flex-direction:column;
    flex:1 1 auto;
    min-height:0;
    overflow:hidden;
}
.dialog-body{
    flex:1 1 auto;
    min-height:0;
    overflow-x:hidden;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    overscroll-behavior-y:contain;
    scrollbar-width:thin;
    scrollbar-color:#b4c1cf #f4f6f9;
}
.dialog-body::-webkit-scrollbar{width:9px}
.dialog-body::-webkit-scrollbar-track{background:#f4f6f9}
.dialog-body::-webkit-scrollbar-thumb{background:#b4c1cf;border-radius:9px;border:2px solid #f4f6f9}
.dialog-body:focus-visible{outline:2px solid #d33;outline-offset:-2px}
.dialog-foot{background:#fff;box-shadow:0 -6px 14px rgba(28,45,67,.055);position:relative;z-index:1}
.dialog-scroll-cue{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    padding:8px 23px;
    background:#fff8f8;
    color:#ab1616;
    border-bottom:1px solid #f4dede;
    font-size:11px;
    font-weight:660;
    flex:0 0 auto;
}
.dialog-scroll-cue[hidden],.dialog-scroll-cue button[hidden]{display:none!important}
.dialog-scroll-cue.at-end{background:#f8fafb;color:#657488;border-color:#e9eef2}
.dialog-scroll-cue button{
    border:0;
    padding:3px 0;
    color:var(--red-deep);
    background:transparent;
    font-size:11px;
    font-weight:770;
    white-space:nowrap;
}
.dialog-scroll-cue button:hover{text-decoration:underline}
body.dialog-open{overflow:hidden}
@media(max-width:720px){
    .dialog{max-height:calc(100vh - 18px);max-height:calc(100dvh - 18px)}
    .dialog-scroll-cue{padding:8px 15px;font-size:10px}
    .dialog-scroll-cue button{font-size:10px}
}

function profileBody(c,vs,rs){if(profileTab==='overview')return `<div class="overviewgrid"><div><h3 class="section-name">Candidate details</h3><div class="details">${[['Mobile',c.mobile],['Email Address',c.email],['Work Domain',c.domain],['Sub-domain',c.subdomain],['Hometown',c.hometown],['Home State',c.homeState],['Ready to Relocate',c.readyToRelocate],['Current Location',c.location],['Notice / Availability',c.notice],['Current Salary',formatSalary(c.currentSalary,c.currentSalaryPeriod)],['Last Salary',c.lastSalary],['Expected Salary',formatSalary(c.expectedSalary,c.expectedSalaryPeriod)],['Source',c.source]].map(([t,v])=>`<div class="detail"><small>${t}</small><b>${briefValue(v)}</b></div>`).join('')}</div><div class="separator"></div><h3 class="section-name">Skills</h3><div class="tags">${c.skills.length?c.skills.map(x=>`<span class="tag">${E(x)}</span>`).join(''):'<span class="muted">Skills not recorded</span>'}</div></div><div class="stack"><div class="inset"><h3>Latest office activity</h3><div class="separator" style="margin:12px 0"></div>${vs.length?`<b class="small">${E(vs[0].purpose)}</b><p class="muted small" style="margin-top:5px">${fmtStamp(vs[0].when)} by ${E(vs[0].by)}</p><p class="small" style="margin-top:8px">${E(vs[0].note||'No note')}</p>`:'<p class="muted small">No office visits. Foundit-sourced candidates do not automatically get one.</p>'}<button class="btn sm" data-modal="visit" data-candidate="${c.id}" style="margin-top:14px">+ New Visit</button></div><div class="inset"><h3>Assistance status</h3><p class="small muted" style="margin-top:9px">${activeRequest(c.id)?`Searching for <b>${E(activeRequest(c.id).role)}</b><br>Assigned to ${E(activeRequest(c.id).owner)}`:'No active personal job-search request.'}</p>${!activeRequest(c.id)?`<button class="btn sm" data-modal="search-new" data-candidate="${c.id}" style="margin-top:12px">+ Start Job Search</button>`:''}</div><div class="note-note">Resume and ChatGPT/Claude JSON can be reviewed in the Resumes & AI JSON tab (browser demo only). Automated AI calls and signed-authority uploads are not connected.</div></div></div>`;
if(profileTab==='documents')return documentsHTML(c);
if(profileTab==='visits')return `<div class="panel-head" style="padding:0 0 15px;border:0"><div><h2>Office Visit History</h2><p>${vs.length} visits linked to this candidate, including repeat visits</p></div><button class="btn sm primary" data-modal="visit" data-candidate="${c.id}">+ Record Visit</button></div><div class="stack">${vs.length?vs.map(v=>`<div class="inset"><div class="item" style="border:0;padding:0"><div><b>${E(v.purpose)}</b><div class="item-sub">${fmtStamp(v.when)} · Recorded by ${E(v.by)}</div><div class="small" style="margin-top:9px">${E(v.note||'No visit note')}</div></div><div>${v.authority.startsWith('Signed')?'<span class="badge green">Signed (reported)</span>':`<span class="badge gray">${E(v.authority)}</span>`}</div></div></div>`).join(''):'<div class="empty">No office visits yet</div>'}</div>`;
if(profileTab==='search')return `<div class="panel-head" style="padding:0 0 14px;border:0"><div><h2>Personal Job Search</h2><p>Independent of company JD hiring requests</p></div>${!activeRequest(c.id)?`<button class="btn sm primary" data-modal="search-new" data-candidate="${c.id}">+ Start Search</button>`:''}</div>${rs.length?rs.map(r=>`<div class="request-card"><div class="request-head"><div><div class="badge-wrap">${badgeStatus(r.status)}<span class="badge gray">${E(r.id)}</span></div><h3 style="font-size:17px;margin-top:10px">${E(r.role||'Job search')}</h3><div class="item-sub">Opened ${fmtDay(r.opened)}</div></div><div class="page-actions"><button class="btn sm" data-modal="search-edit" data-request="${r.id}">Edit / Update</button>${!CLOSED.has(r.status)&&r.next?`<button class="btn sm" data-complete="${r.id}">Mark Follow-up Done</button>`:''}</div></div><div class="requestfields">${[['Preferred locations',r.locations],['Assigned employee',r.owner],['Next action',r.next||'No next action'],['Follow-up date',r.due?fmtDay(r.due):'']].map(([title,val])=>`<div><small>${title}</small><strong>${briefValue(val)}</strong></div>`).join('')}</div>${r.note?`<div class="tip" style="margin-top:14px">${E(r.note)}</div>`:''}${r.events?.length?`<div class="separator"></div><h3 class="section-name">Recent updates</h3><div class="history">${r.events.slice(0,4).map(ev=>`<div class="event"><span class="dot"></span><div><b>${E(ev.title)}</b><p>${E(ev.detail||'')}</p><time>${fmtStamp(ev.when)} · ${E(ev.by)}</time></div></div>`).join('')}</div>`:''}</div>`).join(''):'<div class="empty"><strong>No personal job-search request yet.</strong>The candidate can remain in the general pool without a job-search case.</div>'}`;
return `<div class="row-gap" style="justify-content:space-between;margin-bottom:18px"><h2>Profile Activity</h2><span class="badge gray">Staff-selected, not verified login</span></div><div class="history">${c.events.length?c.events.map(ev=>`<div class="event"><span class="dot"></span><div><b>${E(ev.title)}</b><p>${E(ev.detail)}</p><time>${fmtStamp(ev.when)} · ${E(ev.by)}</time></div></div>`).join(''):'<div class="empty">No recorded changes yet.</div>'}</div>`}

function catalogHTML(){return pageHeading('Classification catalog • UI preview','Domain Catalog','Manage functional domains and their sub-domains. Job titles remain editable free text.',`<button class="btn" data-modal="add-domain">+ Add Domain</button><button class="btn primary" data-modal="add-subdomain">+ Add Sub-domain</button>`)+`<div class="tip inline-tip"><strong>Important:</strong> The domain list below contains DEMO examples, not the approved Jobmitra taxonomy. Import the exact approved taxonomy later. Domain is not a company industry. Do not create a separate Job Role master table for this MVP.</div><div class="panel panel-pad"><div class="row-gap" style="justify-content:space-between"><h2>Domains (${domainCatalog.length})</h2><span class="badge gray">Managed list · browser-only</span></div><div class="catalog-grid">${domainCatalog.map(c=>`<div class="catalog-card"><strong>${E(c.name)}</strong><div class="catalog-list">${c.subdomains.map(x=>`<span>${E(x)}</span>`).join('')||'<span>No subdomains yet</span>'}</div><div style="margin-top:12px"><button class="btn sm" data-modal="add-subdomain" data-domain="${E(c.name)}">+ Add sub-domain</button></div></div>`).join('')}</div></div><div class="review-foot">Catalog additions are visible during this session only. Production catalog will validate duplicate names, preserve IDs on renames and avoid deleting referenced categories.</div>`}
function domainSelectMarkup(selected){return `<select class="control" name="domain" id="domainSelect" aria-label="Work domain"><option value="">Not selected</option>${opts(domainCatalog.map(c=>c.name),selected)}${selected&&!domainCatalog.some(c=>c.name===selected)?`<option value="${E(selected)}" selected>${E(selected)} (previous entry)</option>`:''}</select>`}
function subdomainSelectMarkup(selectedDomain,selected){const cat=domainCatalog.find(c=>c.name===selectedDomain),subs=cat?.subdomains||[];return `<select class="control" name="subdomain" id="subdomainSelect" aria-label="Work sub-domain"><option value="">Not selected</option>${opts(subs,selected)}${selected&&!subs.includes(selected)?`<option value="${E(selected)}" selected>${E(selected)} (previous entry)</option>`:''}</select>`}
function inlineCatalogField(){return `<div class="field full"><span>Functional domain / Sub-domain (optional)</span><div class="form-grid"><div class="field-inline"><label class="field"><span>Domain</span>${domainSelectMarkup('')}</label><button class="btn field-action" type="button" data-catalog-action="show-domain" aria-label="Add domain">+ New</button></div><div class="field-inline"><label class="field"><span>Sub-domain</span>${subdomainSelectMarkup('','')}</label><button class="btn field-action" type="button" data-catalog-action="show-subdomain" aria-label="Add subdomain">+ New</button></div></div><div class="catalog-add-row" id="inlineDomainAdd" hidden><strong class="small">New domain</strong><div class="row-gap"><input id="newDomainName" class="control" placeholder="Functional domain name" maxlength="90"><button type="button" class="btn sm primary" data-catalog-action="save-domain">Add</button><button type="button" class="btn sm" data-catalog-action="cancel-inline">Cancel</button></div><div class="form-error" id="catalogError"></div></div><div class="catalog-add-row" id="inlineSubdomainAdd" hidden><strong class="small">New sub-domain under selected domain</strong><div class="row-gap"><input id="newSubdomainName" class="control" placeholder="Sub-domain name" maxlength="90"><button type="button" class="btn sm primary" data-catalog-action="save-subdomain">Add</button><button type="button" class="btn sm" data-catalog-action="cancel-inline">Cancel</button></div><div class="form-error" id="catalogErrorSub"></div></div><small>Demo catalog only. Job Role is editable free text with suggestions, not a third managed list.</small></div>`}
function refreshSubdomainSelect(selected=''){const el=$('domainSelect'),sub=$('subdomainSelect');if(sub&&el){const cat=domainCatalog.find(c=>c.name===el.value);const available=cat?.subdomains||[];sub.innerHTML='<option value="">Not selected</option>'+opts(available,selected)+(selected&&!available.includes(selected)?`<option value="${E(selected)}" selected>${E(selected)} (previous entry)</option>`:'')}}
function refreshDomainSelect(selected=''){const el=$('domainSelect');if(el)el.innerHTML='<option value="">Not selected</option>'+opts(domainCatalog.map(c=>c.name),selected)}
function catalogAddInline(action){const form=$('dialogForm');if(!form)return;const inlineError=(id,msg)=>{const e=$(id);if(e)e.textContent=msg};if(action==='cancel-inline'){for(const id of ['inlineDomainAdd','inlineSubdomainAdd'])if($(id))$(id).hidden=true;return}
if(action==='show-domain'||action==='show-subdomain'){const id=action==='show-domain'?'inlineDomainAdd':'inlineSubdomainAdd';const other=action==='show-domain'?'inlineSubdomainAdd':'inlineDomainAdd';if($(other))$(other).hidden=true;if($(id))$(id).hidden=false;updateDialogScrollCue();return}
if(action==='save-domain'){const val=$('newDomainName')?.value.trim().replace(/\s+/g,' ');if(!val)return inlineError('catalogError','Enter a domain name.');if(domainCatalog.some(d=>normalizeLabel(d.name)===normalizeLabel(val)))return inlineError('catalogError','This domain already exists. Select it from the list.');domainCatalog.push({name:val,subdomains:[]});domainCatalog.sort((a,b)=>a.name.localeCompare(b.name));refreshDomainSelect(val);refreshSubdomainSelect('');$('inlineDomainAdd').hidden=true;toast('Domain added to demo catalog');return}
if(action==='save-subdomain'){const name=$('newSubdomainName')?.value.trim().replace(/\s+/g,' '),cat=domainCatalog.find(d=>d.name===$('domainSelect')?.value);if(!cat)return inlineError('catalogErrorSub','Select a domain first.');if(!name)return inlineError('catalogErrorSub','Enter a sub-domain name.');if(cat.subdomains.some(x=>normalizeLabel(x)===normalizeLabel(name)))return inlineError('catalogErrorSub','Sub-domain already exists under this domain.');cat.subdomains.push(name);cat.subdomains.sort((a,b)=>a.localeCompare(b));refreshSubdomainSelect(name);$('inlineSubdomainAdd').hidden=true;toast('Sub-domain added under '+cat.name);return}}
function catalogModal(type,domain=''){if(type==='add-domain'){modal('Add Domain','Manage a functional work category (not a company industry).',`<div class="form-grid">${input('New domain name','domainName','',{wide:true,required:true,placeholder:'e.g. A functional work category'})}</div><p class="helper">Demo only. Exact approved taxonomy is still pending.</p>`,'catalog-domain','Add Domain');return}
modal('Add Sub-domain','Create a specialization within an existing functional domain.',`<div class="form-grid">${input('Parent domain','parentDomain',domain||domainCatalog[0]?.name||'',{options:domainCatalog.map(x=>x.name),required:true})}${input('New sub-domain','subdomainName','',{required:true,placeholder:'e.g. Specific work area'})}</div>`,'catalog-subdomain','Add Sub-domain')}
function documentsHTML(c){const docs=resumesFor(c.id),parses=parsesFor(c.id);return `<div class="row-gap" style="justify-content:space-between; margin-bottom:17px"><div><h2>Resumes & Parsed JSON</h2><p class="muted tiny">Keep the original file and ChatGPT/Claude results as separate, versioned records.</p></div><div class="inline-actions"><button class="btn sm" data-modal="upload-resume">+ Upload Resume</button><button class="btn sm primary" data-modal="paste-json">+ Paste AI JSON</button></div></div><div class="alert-note" style="margin-bottom:15px"><strong>Preview-only:</strong> uploaded file bytes and pasted JSON remain in this browser session. Files are not uploaded to a server and will disappear after refresh.</div><div class="document-layout"><section class="inset"><div class="row-gap" style="justify-content:space-between"><h3>Original Resume Files</h3><span class="badge gray">${docs.length} version(s)</span></div><div class="doc-files">${docs.length?docs.map(d=>`<div class="doc-entry"><div class="doc-meta"><strong>${E(d.filename)}</strong><span class="tiny muted">Version ${d.version} · ${(d.size/1024).toFixed(1)} KB · ${fmtStamp(d.created)}</span><span class="tiny muted">Added by ${E(d.by)} · ${E(d.id)}</span></div><button class="btn sm" data-resume-download="${E(d.id)}">Download</button></div>`).join(''):'<div class="empty"><strong>No resume uploaded.</strong>Upload PDF or DOCX as a versioned candidate document.</div>'}</div></section><section class="inset"><div class="row-gap" style="justify-content:space-between"><h3>ChatGPT / Claude JSON</h3><span class="badge gray">${parses.length} result(s)</span></div>${parses.length?parses.map(p=>{const d=documents.find(x=>x.id===p.documentId);return `<div class="doc-entry"><div class="doc-meta"><b>${E(p.provider)} <span class="doc-tag">Needs review</span></b><span class="tiny muted">Source: Resume v${d?.version||'?'} · ${fmtStamp(p.created)}</span><span class="tiny muted">${Object.keys(p.payload).length} top-level fields · Manual profile unchanged</span></div><button class="btn sm" data-show-json="${E(p.id)}">View JSON</button></div>`}).join(''):'<div class="empty"><strong>No parsed JSON yet.</strong>Upload a resume, then paste ChatGPT/Claude JSON linked to that version.</div>'}</section></div><p class="helper" style="margin-top:15px">Later: actual backend will store original PDF/DOCX privately (not in PostgreSQL blobs), plus file metadata in candidate_documents and separate validated JSON results with provider/version metadata. Parsing is manual here; no API calls.</p>`}

function modal(title,subtitle,content,kind,save='Save'){const root=$('modalRoot');root.innerHTML=`<div class="backdrop" role="presentation"><div class="dialog" role="dialog" aria-modal="true" aria-label="${E(title)}"><div class="dialog-header"><div><h2>${E(title)}</h2><p>${E(subtitle)}</p></div><button class="close" data-close aria-label="Close dialog">×</button></div><div class="dialog-scroll-cue" id="dialogScrollCue" hidden><span id="dialogScrollMessage">↓ More fields below — scroll to continue</span><button type="button" data-scroll-more>Next fields ↓</button></div><form id="dialogForm" data-kind="${kind}"><div class="dialog-body" id="dialogScrollBody" tabindex="0" aria-label="Scrollable form fields">${content}<div class="form-error" id="formError" role="alert"></div></div><div class="dialog-foot"><button class="btn" type="button" data-close>Cancel</button><button class="btn primary" type="submit">${E(save)}</button></div></form></div></div>`;$('modalRoot').querySelector('input:not([type=hidden]), select, textarea')?.focus({preventScroll:true});$('dialogScrollBody')?.addEventListener('scroll',updateDialogScrollCue,{passive:true});updateDialogScrollCue()}
function updateDialogScrollCue(){
  const body=$('dialogScrollBody'),cue=$('dialogScrollCue');
  if(!body||!cue)return;
  const hasMore=body.scrollHeight>body.clientHeight+10;
  cue.hidden=!hasMore;
  if(!hasMore)return;
  const atEnd=body.scrollTop+body.clientHeight>=body.scrollHeight-14;
  cue.classList.toggle('at-end',atEnd);
  $('dialogScrollMessage').textContent=atEnd?'✓ You have reached the last fields':'↓ More fields below — skills, salary & availability';
  cue.querySelector('button').hidden=atEnd;
}
function closeModal(){$('modalRoot').innerHTML=''}
function input(label,name,value='',more={}){const type=more.type||'text';const wide=more.wide?'full':'';const req=more.required?'<span class="required"> *</span>':'';let control=more.options?`<select class="control" name="${name}" ${more.required?'required':''}>${opts(more.options,value)}</select>`:type==='textarea'?`<textarea class="control" name="${name}" placeholder="${E(more.placeholder||'')}" rows="2">${E(value)}</textarea>`:`<input class="control" type="${type}" name="${name}" value="${E(value)}" ${more.required?'required':''} ${more.placeholder?`placeholder="${E(more.placeholder)}"`:''} ${more.step?`step="${more.step}"`:''} ${more.min?`min="${more.min}"`:''} ${more.max?`max="${more.max}"`:''} autocomplete="${type==='email'?'email':'off'}">`;return `<label class="field ${wide}"><span>${E(label)}${req}</span>${control}${more.hint?`<small>${E(more.hint)}</small>`:''}</label>`}
function candidateForm(mode){

const profileFields=`<div class="form-section"><div class="form-title">Professional details & job preferences</div><div class="form-grid">${inlineCatalogField()}${input('Qualification','qualification',c.qualification,{placeholder:'e.g. B.Com'})}${input('Experience (years)','experience',c.experience,{type:'number',step:'0.5',min:'0',placeholder:'e.g. 2.5'})}${input('Skills','skills',(c.skills||[]).join(', '),{wide:true,placeholder:'Excel, Tally, GST'})}${input('Current location','location',c.location,{placeholder:'e.g. Indore'})}${input('Preferred work locations','preferred',c.preferred,{placeholder:'e.g. Indore, Dewas'})}<label class="field"><span>Ready to relocate</span><select class="control" name="readyToRelocate"><option value="" ${!c.readyToRelocate?'selected':''}>Not specified</option>${opts(['Yes','No'],c.readyToRelocate)}</select><small>Confirm with candidate, do not assume.</small></label>${input('Hometown','hometown',c.hometown,{placeholder:'e.g. Ujjain'})}<label class="field"><span>Home State / Union Territory</span><select class="control" name="homeState"><option value="">Not specified</option><optgroup label="States (28)">${opts(STATES,c.homeState)}</optgroup><optgroup label="Union Territories (8)">${opts(UNION_TERRITORIES,c.homeState)}</optgroup></select></label></div></div>`;

const searchCheckbox=!edit?`<div class="form-section"><label class="checkline"><input type="checkbox" name="createSearch" ${walkin?'checked':''}><span>Also start a <strong>Job Search Request</strong> for this candidate<br><span class="tiny muted">Recommended for jobseekers; not automatic for Foundit/JD sourcing.</span></span></label>${walkin?'<p class="tiny muted" style="margin-top:9px">First office visit is automatically recorded for a new walk-in.</p>':''}</div>`:'';
modal(edit?'Edit Candidate':walkin?'Register New Walk-in':'Add Candidate',edit?'Update the same profile. Existing visits, resume versions and job searches stay linked.':walkin?'Quick registration + first office visit.':'Add to central candidate pool; job-search assistance remains optional.',identity+profileFields+salaryFields+searchCheckbox,edit?'candidate-edit':walkin?'walkin':'candidate-new',edit?'Save Changes':'Save Candidate');
refreshDomainSelect(c.domain||'');refreshSubdomainSelect(c.subdomain||'');
$('dialogForm').querySelector('input[name="mobile"]').addEventListener('input',()=>checkDuplicate(edit?c.id:null));}
function checkDuplicate(exclude){const mob=$('dialogForm')?.querySelector('input[name="mobile"]')?.value||'';const key=mob.replace(/\D/g,'');const dup=key.length>=7?people.find(c=>c.mobile.replace(/\D/g,'')===key&&c.id!==exclude):null;const n=$('duplicateHint');if(n){n.classList.toggle('visible',!!dup);$('duplicateText').textContent=dup?`Possible duplicate: ${dup.name} (${dup.id}). Open existing instead of registering twice.`:'';$('openDuplicate').dataset.profile=dup?.id||''}return dup}
function candidatePicker(id=''){let c=getCandidate(id);return `<div class="field full candidatepicker"><span>Find existing candidate <span class="required">*</span></span><input class="control" id="candidatePickerSearch" autocomplete="off" placeholder="Type candidate name or mobile number..." value="${c?E(c.name+' · '+c.mobile):''}"><input type="hidden" name="candidateId" id="candidatePickedId" value="${E(id)}"><div id="candidatePickedText" class="pick-choice">${c?'Selected: '+E(c.name)+' ('+E(c.id)+')':''}</div><div class="pick-results" id="candidatePickerResults"></div><small>If not found, cancel and use Register Walk-in.</small></div>`}
function updatePicker(){const el=$('candidatePickerSearch');if(!el)return;const key=el.value.toLowerCase().trim();$('candidatePickedId').value='';$('candidatePickedText').textContent='';if(!key){$('candidatePickerResults').innerHTML='<span class="tiny muted">Start typing to find a candidate</span>';return}const xs=people.filter(c=>(c.name+' '+c.mobile+' '+c.designation).toLowerCase().includes(key)).slice(0,7);$('candidatePickerResults').innerHTML=xs.map(c=>`<button type="button" class="pick-option" data-pick="${c.id}"><span>${E(c.name)} <span class="pick-info">${E(c.designation||'')} </span></span><span class="pick-info">${E(c.mobile)}</span></button>`).join('')||'<span class="tiny muted">No candidate found. Register first.</span>'}
function visitForm(id=''){modal('Record Office Visit','Search an existing profile so repeat visits never create another candidate.',`<div class="form-grid">${candidatePicker(id)}${input('Visit date & time','when',dateTimeLocal(),{type:'datetime-local',required:true})}${input('Visit purpose','purpose','Job search assistance',{options:PURPOSES})}${input('Recorded by','by',actor,{options:STAFF})}${input('Authority status','authority','Not recorded',{options:AUTHORITY})}${input('Brief visit note','note','',{type:'textarea',wide:true,placeholder:'What happened during the visit? Optional'})}</div><p class="tiny muted" style="margin-top:13px">Signed status is staff-reported only. Signed document upload comes in Stage 3B.</p>`,'visit','Save Visit');updatePickerInitial(id)}
function updatePickerInitial(id){if(id){const c=getCandidate(id);if(c){$('candidatePickedId').value=id;$('candidatePickedText').textContent='Selected: '+c.name+' ('+id+')'}}else{$('candidatePickerResults').innerHTML='<span class="tiny muted">Start typing to find a candidate</span>'}}
function searchForm(mode,id=''){const editing=mode==='edit',r=editing?requests.find(r=>r.id===id):null,c=editing?getCandidate(r?.candidateId):id?getCandidate(id):null;modal(editing?'Update Job Search Request':'Start Job Search Request',editing?'Update manual progress, next action or assigned employee.':'Create a separate work request to find jobs for an existing candidate.',`<div class="form-grid">${editing?`<div class="field full"><span>Candidate</span><strong>${E(c?.name||'')} <span class="muted tiny">${E(c?.id||'')}</span></strong></div>`:candidatePicker(c?.id||'')}${input('Desired job role','role',r?.role||c?.designation||'',{required:true,placeholder:'e.g. Accounts Executive'})}${input('Preferred locations','locations',r?.locations||c?.preferred||'',{placeholder:'e.g. Indore, Dewas'})}${input('Assigned employee','owner',r?.owner||actor,{options:STAFF})}${editing?input('Request status','status',r?.status||'Searching',{options:REQSTAT}):''}${input('Next action','next',r?.next||'',{placeholder:'e.g. Call candidate / look for vacancies'})}${input('Follow-up date','due',r?.due||'',{type:'date'})}${input('Short update / note','note',r?.note||'',{type:'textarea',wide:true,placeholder:'Optional work note'})}</div><div class="note-note" style="margin-top:15px">This is a candidate-led request, not a new company JD. Automated JD matching is outside Stage 3A.</div>`,editing?'search-edit':'search-new',editing?'Save Update':'Create Job Search');if(!editing)updatePickerInitial(c?.id||'');if(editing)$('dialogForm').dataset.request=id;}
function fData(form){const data=new FormData(form);return key=>String(data.get(key)??'').trim()}
function fail(msg){const el=$('formError');if(el)el.textContent=msg}
function saveDialog(ev){ev.preventDefault();const form=ev.target;const type=form.dataset.kind;const f=fData(form);
if(type==='json-view'){closeModal();return}
if(type==='catalog-domain'||type==='catalog-subdomain'){const isDomain=type==='catalog-domain',name=f(isDomain?'domainName':'subdomainName').replace(/\s+/g,' ');if(!name)return fail('Enter a name.');if(isDomain){if(domainCatalog.some(d=>normalizeLabel(d.name)===normalizeLabel(name)))return fail('Domain already exists.');domainCatalog.push({name,subdomains:[]});domainCatalog.sort((a,b)=>a.name.localeCompare(b.name));}else{const cat=domainCatalog.find(d=>d.name===f('parentDomain'));if(!cat)return fail('Select a valid parent domain.');if(cat.subdomains.some(x=>normalizeLabel(x)===normalizeLabel(name)))return fail('Sub-domain already exists under this domain.');cat.subdomains.push(name);cat.subdomains.sort((a,b)=>a.localeCompare(b));}closeModal();render();toast(isDomain?'Domain added to demo catalog':'Sub-domain added to demo catalog');return}
if(type==='resume-upload'){const file=$('resumeFileInput')?.files?.[0];if(!file)return fail('Select a PDF or DOCX.');if(!/\.(pdf|docx)$/i.test(file.name))return fail('Use PDF or DOCX.');if(file.size>12*1024*1024||file.size===0)return fail('File must be 1 byte–12 MB.');const c=current();const doc={id:'DOC-'+String(nextDocument++).padStart(3,'0'),candidateId:c.id,kind:'Resume',filename:file.name,size:file.size,mime:file.type||'',created:new Date().toISOString(),by:actor,version:resumesFor(c.id).reduce((mx,d)=>Math.max(mx,d.version),0)+1,file};documents.push(doc);addEvent(c.id,'Resume version added',`v${doc.version}: ${doc.filename}`);closeModal();profileTab='documents';render();toast('Resume saved in browser memory for UI preview');return}
if(type==='resume-json'){let payload;try{payload=JSON.parse(f('json'));if(!payload||Array.isArray(payload)||typeof payload!=='object')throw new Error('Root must be a JSON object.')}catch(e){return fail('Invalid JSON object: '+e.message)}const doc=documents.find(d=>d.id===f('documentId')&&d.candidateId===selectedId);if(!doc)return fail('Select an attached source resume.');const provider=f('provider');if(!['ChatGPT','Claude'].includes(provider))return fail('Choose ChatGPT or Claude.');const rec={id:'PARSE-'+String(nextParse++).padStart(3,'0'),candidateId:selectedId,documentId:doc.id,provider,payload,status:'Needs review',created:new Date().toISOString(),by:actor};resumeParses.push(rec);addEvent(selectedId,provider+' JSON saved','Linked to resume v'+doc.version+'. Manual profile unchanged.');closeModal();profileTab='documents';render();toast('Parsed JSON saved for manual review in demo');return}
if(type==='candidate-new'||type==='walkin'||type==='candidate-edit'){const editing=type==='candidate-edit';const iswalk=type==='walkin';if(!f('name'))return fail('Candidate name is required.');if(!f('mobile'))return fail('Mobile number is required for this quick-entry flow.');const digits=f('mobile').replace(/\D/g,'');if(digits.length<8||digits.length>15)return fail('Enter a usable mobile number (8–15 digits); text format will be preserved.');const duplicate=people.find(c=>c.mobile.replace(/\D/g,'')===digits&&c.id!==(editing?selectedId:null));if(duplicate&&!form.querySelector('[name="separateRecord"]')?.checked)return fail('Possible duplicate found. Open the existing profile or confirm that this is a separate person.');if(f('experience')&&(Number(f('experience'))<0||Number(f('experience'))>80))return fail('Experience must be between 0 and 80 years.');const data={name:f('name'),mobile:f('mobile'),email:f('email'),source:f('source'),designation:f('designation'),domain:f('domain'),subdomain:f('subdomain'),experience:f('experience'),qualification:f('qualification'),skills:[...new Set(f('skills').split(',').map(x=>x.trim()).filter(Boolean))],location:f('location'),preferred:f('preferred'),hometown:f('hometown'),homeState:f('homeState'),readyToRelocate:f('readyToRelocate'),currentSalary:f('currentSalary'),currentSalaryPeriod:f('currentSalaryPeriod'),lastSalary:f('lastSalary'),expectedSalary:f('expectedSalary'),expectedSalaryPeriod:f('expectedSalaryPeriod'),notice:f('notice')};if(data.email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(data.email))return fail('Enter a valid email address or leave the field blank.');if(!['','Yes','No'].includes(data.readyToRelocate))return fail('Ready to relocate must be Yes or No.');if(data.subdomain&&(!domainCatalog.some(d=>d.name===data.domain&&d.subdomains.includes(data.subdomain))))return fail('Sub-domain must belong to selected domain.');for(const key of ['currentSalary','expectedSalary'])if(data[key]&&(!Number.isFinite(Number(data[key]))||Number(data[key])<0))return fail('Salary amount must be a non-negative number.');let c;if(editing){c=current();const old=JSON.stringify(data);const was=JSON.stringify(Object.fromEntries(Object.keys(data).map(k=>[k,c[k]])));Object.assign(c,data);if(old!==was)addEvent(c.id,'Profile updated','Candidate details edited manually');}else{c={id:'CAN-'+String(nextCandidate++).padStart(3,'0'),...data,created:dateLocal(),events:[]};people.unshift(c);addEvent(c.id,'Candidate registered',`Source: ${c.source}`);if(iswalk){const v={id:'VIS-'+String(nextVisit++).padStart(3,'0'),candidateId:c.id,when:dateTimeLocal(),purpose:'Job search assistance',authority:'Not recorded',by:actor,note:'First office registration'};visits.unshift(v);addEvent(c.id,'First office visit recorded','Auto-recorded for new walk-in');}if(form.querySelector('[name="createSearch"]')?.checked){requests.unshift({id:'JS-'+String(nextRequest++).padStart(3,'0'),candidateId:c.id,role:c.designation,locations:c.preferred,owner:actor,status:'Searching',opened:dateLocal(),next:'',due:'',note:'',events:[]});addEvent(c.id,'Job search started','Candidate requested Jobmitra assistance')}}selectedId=c.id;profileTab='overview';view='profile';closeModal();render();toast(editing?'Candidate details updated':'Candidate registered successfully');return}
if(type==='visit'){const person=getCandidate(f('candidateId'));if(!person)return fail('Select an existing candidate from search results.');if(!f('when'))return fail('Visit date/time is required.');visits.unshift({id:'VIS-'+String(nextVisit++).padStart(3,'0'),candidateId:person.id,when:f('when'),purpose:f('purpose'),authority:f('authority'),by:f('by'),note:f('note')});addEvent(person.id,'Office visit recorded',f('purpose')+(f('note')?' · '+f('note'):''),f('by'));selectedId=person.id;profileTab='visits';view='profile';closeModal();render();toast('Office visit saved to existing candidate');return}
if(type==='search-new'||type==='search-edit'){const editing=type==='search-edit',r=editing?requests.find(r=>r.id===form.dataset.request):null;const person=editing?getCandidate(r.candidateId):getCandidate(f('candidateId'));if(!person)return fail('Select an existing candidate.');if(!f('role'))return fail('Enter the type of job the candidate is looking for.');if(!editing&&activeRequest(person.id)){return fail('An active job-search request already exists for this candidate. Open and update that request instead.')}if(editing){const old=r.status;Object.assign(r,{role:f('role'),locations:f('locations'),owner:f('owner'),status:f('status'),next:f('next'),due:f('due'),note:f('note')});r.events.unshift({title:old!==r.status?'Search status changed':'Search request updated',detail:old!==r.status?old+' → '+r.status:(r.next||r.note||'Details updated'),when:new Date().toISOString(),by:actor});addEvent(person.id,'Job-search request updated',r.status+' · '+(r.next||'No next action'));}else{requests.unshift({id:'JS-'+String(nextRequest++).padStart(3,'0'),candidateId:person.id,role:f('role'),locations:f('locations'),owner:f('owner'),status:'Searching',opened:dateLocal(),next:f('next'),due:f('due'),note:f('note'),events:[]});addEvent(person.id,'Job-search request started',f('role'))}selectedId=person.id;view='profile';profileTab='search';closeModal();render();toast('Job search saved');return}}
function completeFollowup(id){const r=requests.find(r=>r.id===id);if(!r||!r.next)return;r.events.unshift({title:'Follow-up completed',detail:r.next,by:actor,when:new Date().toISOString()});addEvent(r.candidateId,'Follow-up completed',r.next);r.next='';r.due='';render();toast('Follow-up marked done')}
document.addEventListener('click',ev=>{const b=ev.target.closest('button');if(!b)return;if(b.hasAttribute('data-close')){closeModal();return}if(b.hasAttribute('data-scroll-more')){const body=$('dialogScrollBody');if(body)body.scrollBy({top:Math.max(200,Math.round(body.clientHeight*.8)),behavior:'smooth'});return}if(b.dataset.catalogAction){catalogAddInline(b.dataset.catalogAction);return}
if(b.dataset.resumeDownload){const d=documents.find(x=>x.id===b.dataset.resumeDownload);if(d){const url=URL.createObjectURL(d.file);const a=document.createElement('a');a.href=url;a.download=d.filename;a.click();setTimeout(()=>URL.revokeObjectURL(url),15000);toast('Downloading original in-memory demo file');}return}
if(b.dataset.showJson){showJSONModal(b.dataset.showJson);return}
if(b.dataset.jsonDemo){const input=$('resumeParsedJSON');if(input){input.value=JSON.stringify({job_title:'Data Engineer',skills:[{name:'Python'},{name:'SQL'}],experience_months_declared:36},null,2);input.dispatchEvent(new Event('input',{bubbles:true}));}return}
if(b.dataset.nav){view=b.dataset.nav;render();return}if(b.dataset.profile){if(b.dataset.profile==='')return;selectedId=b.dataset.profile;view='profile';profileTab=b.dataset.ptab||'overview';closeModal();render();return}if(b.dataset.tab){profileTab=b.dataset.tab;render();return}if(b.dataset.complete){completeFollowup(b.dataset.complete);return}if(b.dataset.pick){const c=getCandidate(b.dataset.pick);if(!c)return;$('candidatePickedId').value=c.id;$('candidatePickerSearch').value=c.name+' · '+c.mobile;$('candidatePickedText').textContent='Selected: '+c.name+' ('+c.id+')';$('candidatePickerResults').innerHTML='';return}if(b.dataset.modal){switch(b.dataset.modal){case 'candidate-new':candidateForm('new');break;case 'candidate-edit':candidateForm('edit');break;case 'walkin':candidateForm('walkin');break;case 'visit':visitForm(b.dataset.candidate||'');break;case 'search-new':searchForm('new',b.dataset.candidate||'');break;case 'search-edit':searchForm('edit',b.dataset.request);break;case 'upload-resume':uploadResumeModal();break;case 'paste-json':pasteJSONModal();break;case 'add-domain':catalogModal('add-domain');break;case 'add-subdomain':catalogModal('add-subdomain',b.dataset.domain||'');break}return}});
document.addEventListener('input',ev=>{const t=ev.target;if(t.id==='candidateSearch'){directorySearch=t.value;$('candidateRows').innerHTML=candidateRows();$('candidateCount').textContent=filteredPeople().length+' candidates'}if(t.id==='visitSearch'){visitsSearch=t.value;$('visitRows').innerHTML=visitRows();$('visitCount').textContent=filteredVisits().length+' visits'}if(t.id==='requestSearch'){requestsSearch=t.value;$('requestRows').innerHTML=requestRows();$('requestCount').textContent=filteredRequests().length+' requests'}if(t.id==='candidatePickerSearch')updatePicker();if(t.id==='resumeParsedJSON'){let status='JSON syntax is valid. Review and provenance checks are still required.';try{const v=JSON.parse(t.value);if(!v||Array.isArray(v)||typeof v!=='object')status='Root must be a JSON object.'}catch(e){status='Not valid JSON yet: '+e.message}if($('jsonPreviewMsg'))$('jsonPreviewMsg').textContent=status}});
document.addEventListener('change',ev=>{const t=ev.target;if(t.id==='actor')actor=t.value;if(t.id==='domainSelect')refreshSubdomainSelect('');if(t.id==='sourceFilter'){directorySource=t.value;$('candidateRows').innerHTML=candidateRows();$('candidateCount').textContent=filteredPeople().length+' candidates'}if(t.id==='visitFilter'){visitsFilter=t.value;$('visitRows').innerHTML=visitRows();$('visitCount').textContent=filteredVisits().length+' visits'}if(t.id==='requestFilter'){requestsFilter=t.value;$('requestRows').innerHTML=requestRows();$('requestCount').textContent=filteredRequests().length+' requests'}});
document.addEventListener('submit',ev=>{if(ev.target.id==='dialogForm')saveDialog(ev)});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape')closeModal()});
render();
})();
