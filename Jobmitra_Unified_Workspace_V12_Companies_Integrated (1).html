:14px;margin:0 0 2px}.activity-card textarea{min-height:85px;resize:vertical}.activity-row{border-top:1px solid #ecf0f5;padding:12px 0;display:flex;justify-content:space-between;align-items:start;gap:12px}.activity-row:first-child{border-top:none}.activity-row strong{font-size:12px}.activity-row small{font-size:10px;color:#8292a5}.activity-note{font-size:11px;color:#687c93;white-space:pre-wrap}@media(max-width:850px){.activity-layout{grid-template-columns:1fr}}\n</style>\n<main class=\"wrap\">\n<div class=\"breadcrumbs\">Workspace <span>›</span> <strong>Candidate Desk</strong> <span>›</span> <span id=\"currentCrumb\">Candidate Search</span></div>\n<div class=\"pagehead\"><div><div class=\"eyebrow\">CANDIDATE OPERATIONS · EXPERIMENTAL PREVIEW</div><h1>Candidate Desk</h1><p class=\"subtitle\" id=\"pageSubtitle\">A focused workspace for profiles, sourcing and JD participation.</p></div><div class=\"head-actions\"><button class=\"btn primary\" id=\"registerBtn\" type=\"button\">＋ Register Candidate</button></div></div>\n<div aria-label=\"Candidate Desk sections\" class=\"tabs\" role=\"tablist\"><button class=\"tab\" data-tab=\"dashboard\" role=\"tab\" type=\"button\">Candidate Dashboard</button><button class=\"tab active\" data-tab=\"search\" role=\"tab\" type=\"button\">Candidate Search</button><button class=\"tab\" data-tab=\"candidates\" role=\"tab\" type=\"button\">Candidates</button><button class=\"tab\" data-tab=\"pool\" role=\"tab\" type=\"button\">JD Pools</button><button class=\"tab\" data-tab=\"resumes\" role=\"tab\" type=\"button\">Resumes</button><details class=\"more-tabs\"><summary>More <span aria-hidden=\"true\">⌄</span></summary><div class=\"more-menu\"><button data-tab=\"today\" type=\"button\">Today</button><button data-tab=\"visits\" type=\"button\">Office Visits</button><button data-tab=\"requests\" type=\"button\">Job Search Requests</button><button data-tab=\"foundit\" type=\"button\">Foundit Paste</button><button data-tab=\"domains\" type=\"button\">Domain Catalog</button><button id=\"resetBtn\" style=\"border-top:1px solid #edf0f4;color:#9b6770\" type=\"button\">Reset preview data</button></div></details></div>\n<div id=\"searchView\">\n<form autocomplete=\"off\" class=\"box searchbar\" id=\"searchForm\">\n<div class=\"field keyword\"><label for=\"query\">Skills, job title or keywords</label><input class=\"control\" id=\"query\" placeholder=\"e.g. Tally, GST, Python, FastAPI\"/></div>\n<div class=\"field\"><label for=\"location\">Current / preferred location</label><input class=\"control\" id=\"location\" placeholder=\"City or remote\"/></div>\n<div class=\"field rangeField\"><label for=\"expMin\">Experience · years</label><div class=\"inputpair\"><input aria-label=\"Minimum experience in years\" class=\"control\" id=\"expMin\" max=\"60\" min=\"0\" placeholder=\"Min\" step=\"0.5\" type=\"number\"/><span>–</span><input aria-label=\"Maximum experience in years\" class=\"control\" id=\"expMax\" max=\"60\" min=\"0\" placeholder=\"Max\" step=\"0.5\" type=\"number\"/></div></div>\n<div class=\"field rangeField\"><label for=\"minSalary\">Expected salary · ₹</label><div class=\"inputpair\"><input aria-label=\"Minimum expected salary\" class=\"control\" id=\"minSalary\" min=\"0\" placeholder=\"Min\" step=\"1000\" type=\"number\"/><span>–</span><input aria-label=\"Maximum expected salary\" class=\"control\" id=\"maxSalary\" min=\"0\" placeholder=\"Max\" step=\"1000\" type=\"number\"/></div></div>\n<button class=\"btn primary searchbtn\" type=\"submit\">Search →</button>\n<div class=\"searchoptions\"><div class=\"inlinefield\"><label for=\"salaryPeriod\">Salary period</label><select class=\"control\" id=\"salaryPeriod\"><option value=\"MONTHLY\">Monthly</option><option value=\"ANNUAL\">Annual</option></select></div><div class=\"inlinefield\"><label for=\"salaryBasis\">Salary basis</label><select class=\"control\" id=\"salaryBasis\"><option value=\"ANY\">Any / indicative</option><option value=\"CTC\">CTC</option><option value=\"GROSS\">Gross</option><option value=\"IN_HAND\">In-hand</option></select></div><div class=\"inlinefield\"><label>Keyword match</label><div class=\"match-toggle\" id=\"matchToggle\"><button class=\"active\" data-match=\"any\" type=\"button\">Any</button><button data-match=\"all\" type=\"button\">All</button></div></div><button class=\"btn outline tiny\" id=\"showFiltersBtn\" type=\"button\">More filters <span aria-hidden=\"true\">⌄</span></button><button class=\"btn ghost tiny\" id=\"clearFilters\" type=\"button\">Clear filters</button></div>\n</form>\n<aside aria-label=\"Additional search filters\" class=\"box filters\" id=\"filtersPanel\"><div class=\"advanceHeading\"><b>Additional criteria</b><span>These filters are optional</span></div><div class=\"advanceGrid\"><div class=\"field\"><label for=\"notice\">Maximum notice period</label><select class=\"control\" id=\"notice\"><option value=\"\">Any</option><option value=\"0\">Immediate</option><option value=\"15\">15 days</option><option value=\"30\">30 days</option><option value=\"60\">60 days</option></select></div><div class=\"field\"><label for=\"availability\">Availability</label><select class=\"control\" id=\"availability\"><option value=\"\">Any</option><option value=\"Available\">Available</option><option value=\"To confirm\">To confirm</option></select></div><label class=\"check\"><input checked=\"\" id=\"unknownExp\" type=\"checkbox\"/> Include unknown experience</label><label class=\"check\"><input checked=\"\" id=\"unknownSalary\" type=\"checkbox\"/> Include unknown / non-comparable salary</label><label class=\"check\"><input checked=\"\" id=\"unknownNotice\" type=\"checkbox\"/> Include unknown notice</label></div></aside>\n<div class=\"workspace\" id=\"candidateWorkspace\"><section aria-label=\"Candidate search results\" class=\"results\"><div class=\"resultstop\"><div><h2 id=\"resultCount\">Candidate Results</h2><div class=\"muted\" id=\"resultExplain\">Select a candidate to inspect their profile</div></div><label class=\"sortlabel\">Sort by <select id=\"sort\"><option value=\"relevance\">Relevance</option><option value=\"recent\">Recently updated</option><option value=\"experience\">Experience: high to low</option></select></label></div><div aria-live=\"polite\" class=\"resultlist\" id=\"resultsList\"></div></section><div class=\"detail-underlay\" id=\"detailUnderlay\"></div><aside aria-label=\"Candidate details and JD association\" class=\"box detail\" id=\"detailPanel\"><div class=\"detail-head\"><strong>Candidate Details</strong><button aria-label=\"Close candidate details\" class=\"btn square\" id=\"closeDetail\" type=\"button\">✕</button></div><div id=\"detailContent\"></div></aside></div>\n</div>\n<section class=\"hidden\" id=\"poolView\"><div class=\"notice\"><span>ⓘ</span><div><b>JD Candidate Pool = existing candidate + active JD.</b> Adding here does not register a new candidate, send an email, or change their recruitment stage. The same candidate cannot be added twice to one JD.</div></div><div class=\"pool-top\"><div><h2 style=\"margin:0 0 4px\">JD Candidate Pool</h2><p class=\"subtitle\" style=\"margin:0\">Current demo associations, grouped by active job requirement</p></div><label class=\"field\" style=\"min-width:min(350px,100%);width:350px\"><span>Active job requirement</span><select class=\"control\" id=\"poolJobSelect\"></select></label></div><div class=\"pool-main\"><div class=\"box pool-list\"><h2 id=\"poolTitle\">Candidate Pool</h2><p class=\"sub\" id=\"poolDescription\">All candidates already associated with this requirement</p><div id=\"poolRows\"></div></div><aside class=\"box pool-aside\"><h3>JD Summary</h3><div id=\"poolSummary\"></div><button class=\"btn primary block\" id=\"findForJD\" style=\"margin-top:15px\" type=\"button\">Find more candidates →</button><p class=\"help\" style=\"margin-top:12px\">Recruitment stage progression is managed on the JD Candidate Pipeline, not automatically when you add a candidate.</p></aside></div></section>\n<section class=\"hidden\" id=\"dashboardView\"><div class=\"dashboard-top\"><div><div class=\"eyebrow\">CANDIDATE OPERATIONS</div><h2>Candidate Dashboard</h2><p class=\"subtitle\">Candidate readiness, JD participation and recently added profiles.</p></div></div><div class=\"today-grid\" id=\"dashboardStats\"></div><div class=\"dashboard-two\"><section class=\"box today-card\"><div class=\"sectionHead\"><h2>Recently updated profiles</h2><button class=\"btn tiny outline\" data-tab=\"candidates\" type=\"button\">All Candidates →</button></div><div id=\"recentCandidates\"></div></section><section class=\"box today-card\"><h2>Recruiter attention</h2><div id=\"dashboardAttention\"></div><div class=\"dashboard-tip\">Search candidates, review professional evidence and link profiles to active JDs without duplicating candidate registrations.</div></section></div></section>\n<section class=\"hidden\" id=\"candidatesView\"><div class=\"sectionHead\"><div><h2>All Candidates</h2><p class=\"subtitle\">Single candidate master. Full information can be completed later.</p></div></div><div class=\"box listbox\" id=\"candidateTable\"></div><div aria-live=\"polite\" class=\"candidate-profile-screen hidden\" id=\"candidateProfileScreen\"></div></section>\n<section class=\"hidden\" id=\"resumesView\"><div class=\"sectionHead\"><div><h2>Resumes &amp; parsed profiles</h2><p class=\"subtitle\">Review resumes from a candidate profile. Original documents and structured information remain separate.</p></div></div><div class=\"box today-card\"><h2>Resume register</h2><div id=\"resumesList\"></div><div class=\"dashboard-tip\">Standalone preview stores only newly selected filenames, not uploaded document bytes. Production file upload needs FastAPI storage.</div></div></section>\n<section class=\"hidden\" id=\"todayView\"><div class=\"box today-card\"><h2>Today</h2><p class=\"subtitle\">Use Candidate Dashboard for current activity and candidate registration. Office Visits and Job Search Requests remain separate candidate operations in the existing system.</p><button class=\"btn primary\" data-tab=\"dashboard\">Open Candidate Dashboard →</button></div></section>\n\n <section id=\"visitsView\" class=\"hidden\"><div class=\"sectionHead\"><div><h2>Office Visits</h2><p class=\"subtitle\">Record candidate visits without changing recruitment stages.</p></div></div>\n <div class=\"activity-layout\"><form class=\"box activity-card\" id=\"officeVisitForm\"><h3>Record office visit</h3><div class=\"field\"><label for=\"visitCandidate\">Candidate *</label><select class=\"control\" id=\"visitCandidate\" required></select></div><div class=\"field\"><label for=\"visitDate\">Visit date *</label><input class=\"control\" type=\"date\" id=\"visitDate\" required></div><div class=\"field\"><label for=\"visitPurpose\">Purpose *</label><select class=\"control\" id=\"visitPurpose\" required><option value=\"Discussion\">Discussion</option><option value=\"Registration\">Registration</option><option value=\"Documentation\">Documentation</option><option value=\"Screening\">Screening</option><option value=\"Follow-up\">Follow-up</option></select></div><div class=\"field\"><label for=\"visitNotes\">Notes (optional)</label><textarea class=\"control\" id=\"visitNotes\" maxlength=\"800\" rows=\"3\" placeholder=\"What was discussed?\"></textarea></div><button class=\"btn primary\" type=\"submit\">Save visit</button></form>\n <div class=\"box activity-card\"><h3>Office visit history</h3><div id=\"visitRecords\" aria-live=\"polite\"></div></div></div></section>\n <section id=\"requestsView\" class=\"hidden\"><div class=\"sectionHead\"><div><h2>Job Search Requests</h2><p class=\"subtitle\">Track a candidate's job preferences and follow-ups.</p></div></div>\n <div class=\"activity-layout\"><form class=\"box activity-card\" id=\"jobRequestForm\"><h3>New search request</h3><div class=\"field\"><label for=\"requestCandidate\">Candidate *</label><select class=\"control\" id=\"requestCandidate\" required></select></div><div class=\"field\"><label for=\"requestRole\">Preferred role *</label><input class=\"control\" id=\"requestRole\" maxlength=\"150\" placeholder=\"e.g. Accounts Executive\" required></div><div class=\"field\"><label for=\"requestLocation\">Preferred location (optional)</label><input class=\"control\" id=\"requestLocation\" maxlength=\"120\" placeholder=\"e.g. Indore\"></div><div class=\"field\"><label for=\"requestStatus\">Request status</label><select class=\"control\" id=\"requestStatus\"><option>Open</option><option>Following up</option><option>Fulfilled</option><option>Closed</option></select></div><div class=\"field\"><label for=\"requestNotes\">Notes (optional)</label><textarea class=\"control\" id=\"requestNotes\" maxlength=\"800\" rows=\"3\"></textarea></div><button class=\"btn primary\" type=\"submit\">Save request</button></form>\n <div class=\"box activity-card\"><h3>Request history</h3><div id=\"requestRecords\" aria-live=\"polite\"></div></div></div></section>\n<section class=\"hidden\" id=\"reservedView\"><div class=\"box today-card\" style=\"max-width:800px\"><h2 id=\"reservedTitle\">Existing section</h2><p class=\"subtitle\">This legacy operation is outside this standalone preview. It remains available in the existing Jobmitra application and is not simulated here.</p><button class=\"btn primary\" id=\"reservedSearch\" type=\"button\">Back to Candidate Search</button></div></section>\n</main>\n<div aria-live=\"polite\" class=\"toast\" id=\"toast\" role=\"status\"></div>\n<div id=\"modalHost\"></div>";
 function activate(which){
   const area=which==='companies'?'companies':which==='jd'?'jd':'candidate';
   hostCompanies.hidden=area!=='companies';hostCandidate.hidden=area!=='candidate';hostJD.hidden=area!=='jd';
   for(const [id,key] of [['unifiedCompaniesTab','companies'],['unifiedCandidateTab','candidate'],['unifiedJDTab','jd']]){
     const t=window.document.getElementById(id);t.setAttribute('aria-selected',String(area===key));
   }
   if(area==='candidate')window.JobmitraUnifiedCandidate?.refreshJobs?.();
   if(area==='companies')window.JobmitraUnifiedCompanies?.refreshFromJD?.();
   window.scrollTo({top:0,behavior:'instant'});
 }
 window.JobmitraUnified={
   openCandidate:(id)=>{activate('candidate');window.JobmitraUnifiedCandidate?.showCandidateHistory(id);},
   openJD:(jobId)=>{activate('jd');window.JobmitraUnifiedJD?.openJob(jobId);},
   openCompany:(company)=>{activate('companies');window.JobmitraUnifiedCompanies?.showCompany?.(company);},
   show:(where)=>activate(where==='jd'?'jd':where==='companies'?'companies':'candidate')
 };
 for(const [id,which] of [['unifiedCompaniesTab','companies'],['unifiedCandidateTab','candidate'],['unifiedJDTab','jd']]){

 class=\"field\" id=\"companyNameField\"><label for=\"companyName\">Hiring company <span class=\"required\">*</span></label><input id=\"companyName\" type=\"text\" placeholder=\"e.g. ABC Technologies\" autocomplete=\"off\" maxlength=\"160\"></div>\n        <div class=\"field\" id=\"jobLocationField\"><label for=\"jobLocation\">Job location <span class=\"required\">*</span></label><input id=\"jobLocation\" type=\"text\" placeholder=\"e.g. Indore, MP\" autocomplete=\"off\" maxlength=\"160\"></div>\n        <div class=\"field\"><label for=\"candidateStatus\">Email template <span class=\"required\">*</span></label>\n          <select id=\"candidateStatus\">\n            <optgroup label=\"Jobmitra internal screening\">\n              <option value=\"jobmitra_screening\">Jobmitra Screening · Invitation</option>\n              <option value=\"screening_completed\">Screening Completed · Feedback Pending</option>\n              <option value=\"screening_cleared\">Screening Cleared</option>\n            </optgroup>\n            <optgroup label=\"Company interviews / custom rounds\">\n              <option value=\"interview_scheduled\">Company Interview · Scheduled</option>\n              <option value=\"technical_interview\">Technical Interview · Scheduled</option>\n              <option value=\"custom_round\">Custom Company Interview Round</option>\n              <option value=\"round1_completed\">Round 1 · Completed</option>\n              <option value=\"round1_cleared\">Round 1 · Cleared</option>\n              <option value=\"round2_completed\">Round 2 · Completed</option>\n              <option value=\"round2_cleared\">Round 2 · Cleared</option>\n              <option value=\"final_completed\">Final / Senior Management Interview</option>\n            </optgroup>\n            <optgroup label=\"Selection & after-selection\">\n              <option value=\"selected\" selected>Selected by Hiring Company</option>\n              <option value=\"offer_received\">Offer Shared / Received</option>\n              <option value=\"joined\">Joined Successfully</option>\n              </optgroup>\n            <optgroup label=\"Not Selected · Candidate communication\">\n              <option value=\"not_selected\">Not Selected · Candidate Application Update</option>\n            </optgroup>\n            <optgroup label=\"Company-facing coordination\">\n              <option value=\"candidate_submission\">Candidate Submission · Profiles to Company</option>\n              <option value=\"f2f_company\">F2F Interview · Confirmation to Company</option>\n            </optgroup>\n          </select><div class=\"hint\" id=\"statusHint\">Use only after the hiring company has confirmed the selection.</div><button id=\"notSelectedQuick\" type=\"button\" class=\"secondary-btn\" style=\"margin-top:9px;width:100%;background:#fff7f7;color:#a52b38;border-color:#f0d3d8;\">Not Selected · Open candidate application update</button>\n        </div>\n        <div id=\"submissionFields\" class=\"hidden\" aria-label=\"Company candidate submission\">\n          <div class=\"section-line\"></div>\n          <div class=\"mini-heading\">Candidate Submission</div>\n          <div class=\"field\"><label for=\"submissionContact\">Contact person (optional)</label><input id=\"submissionContact\" type=\"text\" placeholder=\"e.g. Hiring Team / Mr. Mehta\" maxlength=\"130\"></div>\n          <div class=\"field-row submission-start-row\">\n            <div class=\"field\"><label for=\"submissionStart\">Starting S.No. <span class=\"required\">*</span></label><input type=\"number\" id=\"submissionStart\" min=\"1\" max=\"99999\" step=\"1\" value=\"1\"><div class=\"hint\">Previously submitted 1–4? Enter 5 to continue serial numbering.</div></div>\n            <div class=\"field submission-add-wrapper\"><label>Add profiles</label><button class=\"secondary-btn\" id=\"submissionAdd\" type=\"button\">+ Add Candidate</button></div>\n          </div>\n          <div id=\"submissionRows\" class=\"submission-rows\" aria-live=\"polite\"></div>\n          <p class=\"hint\">Current and Expected CTC are optional. A salary column appears only when at least one candidate has a meaningful amount. Missing values remain —.</p>\n        </div>\n        <div id=\"otherStageFieldsHeading\"><div class=\"section-line\"></div>\n        <div class=\"mini-heading\">Stage-specific details</div></div>\n        <div class=\"field privacy-note\" id=\"candidatePrivacyNotice\"><strong>Candidate confidentiality</strong><span>Company name is excluded from candidate-facing messages until the candidate is confirmed selected. Review manual notes and meeting links, which may reveal the employer. Company-facing confirmations are handled separately.</span></div>\n        <div id=\"roundFields\" class=\"hidden\">\n          <div class=\"field-row\">\n            <div class=\"field\"><label for=\"roundName\">Interview round name <span class=\"required\">*</span></label><input id=\"roundName\" type=\"text\" maxlength=\"110\" placeholder=\"e.g. Round 3 · Director Discussion\"></div>\n            <div class=\"field\"><label for=\"roundInterviewer\">Interview panel / designation (optional)</label><input id=\"roundInterviewer\" type=\"text\" maxlength=\"110\" placeholder=\"e.g. Senior Management\"></div>\n          </div>\n          <p class=\"hint\">Use the exact configured JD round name. Dates, time, mode and meeting link are entered in the interview scheduling section below.</p>\n        </div>\n        <div id=\"interviewScheduleFields\" class=\"hidden\">\n          <div class=\"field-row\"><div class=\"field\"><label for=\"interviewDate\">Confirmed interview date</label><input id=\"interviewDate\" type=\"date\"></div><div class=\"field\"><label for=\"interviewTime\">Interview time</label><input id=\"interviewTime\" type=\"time\"></div></div>\n          <div class=\"field\"><label for=\"interviewMode\">Interview mode</label><select id=\"interviewMode\"><option value=\"\">Not specified</option><option value=\"Online\">Online</option><option value=\"In person\">In person</option><option value=\"Telephone\">Telephone</option></select></div>\n          <div class=\"field\"><label for=\"interviewMeetingLink\">Interview meeting link (optional)</label><input id=\"interviewMeetingLink\" type=\"url\" placeholder=\"https://meet.google.com/xxx-xxxx-xxx\" autocomplete=\"off\" maxlength=\"500\"><div class=\"hint\">Paste the confirmed meeting URL manually. It will appear as a clickable link in the email; no meeting will be created automatically.</div></div>\n          <div class=\"field-row\">\n            <div class=\"field\"><label for=\"interviewMeetingId\">Meeting ID (optional)</label><input id=\"interviewMeetingId\" type=\"text\" maxlength=\"120\" autocomplete=\"off\" placeholder=\"e.g. 123 456 789\"></div>\n            <div class=\"field\"><label for=\"interviewPasscode\">Meeting passcode (optional)</label><input id=\"interviewPasscode\" type=\"text\" maxlength=\"120\" autocomplete=\"off\" placeholder=\"If provided by the organizer\"></div>\n          </div>\n          <div class=\"hint\">The email displays only meeting details you enter. A blank link, ID or passcode never creates an empty table row.</div>\n        </div>\n        <div id=\"technicalInterviewFields\" class=\"hidden\">\n          <div class=\"hint\" style=\"margin:-2px 0 13px;\">Enter the interview details shared by the hiring company. This invitation is sent by Jobmitra to the candidate.</div>\n          <div class=\"field-row\">\n            <div class=\"field\"><label for=\"technicalDate\">Technical interview date <span class=\"required\">*</span></label><input id=\"technicalDate\" type=\"date\"></div>\n            <div class=\"field\"><label for=\"technicalTime\">Interview time <span class=\"required\">*</span></label><input id=\"technicalTime\" type=\"time\"></div>\n          </div>\n          <div class=\"field\"><label for=\"technicalMeetingLink\">Interview meeting link (or provide Meeting ID below)</label><input id=\"technicalMeetingLink\" type=\"url\" placeholder=\"https://teams.microsoft.com/meet/...\" autocomplete=\"off\" maxlength=\"1000\"><div class=\"hint\">Paste the company's confirmed joining URL. It appears in the email as a clickable link. No meeting is created automatically.</div></div>\n          <div class=\"field-row\">\n            <div class=\"field\"><label for=\"technicalMeetingId\">Meeting ID (if provided)</label><input id=\"technicalMeetingId\" type=\"text\" placeholder=\"e.g. 414 267 929\" autocomplete=\"off\" maxlength=\"120\"></div>\n            <div class=\"field\"><label for=\"technicalPasscode\">Meeting passcode (if provided)</label><input id=\"technicalPasscode\" type=\"text\" placeholder=\"From company invite\" autocomplete=\"off\" maxlength=\"120\"></div>\n          </div>\n          <div class=\"hint\">The interview date, time and either a meeting URL or Meeting ID are required before copying. Use Additional note for instructions from the company.</div>\n        </div>\n        <div id=\"finalInterviewFields\" class=\"hidden\">\n          <div class=\"hint\" style=\"margin:-2px 0 13px;\">Enter the confirmed final interview details provided by the hiring company. Only the candidate name and meeting details appear in this email.</div>\n          <div class=\"field-row\">\n            <div class=\"field\"><label for=\"finalDate\">Final interview date <span class=\"required\">*</span></label><input id=\"finalDate\" type=\"date\"></div>\n            <div class=\"field\"><label for=\"finalTime\">Interview time <span class=\"required\">*</span></label><input id=\"finalTime\" type=\"time\"></div>\n          </div>\n          <div class=\"field\"><label for=\"finalMeetingLink\">Meeting link (or provide Meeting ID below)</label><input id=\"finalMeetingLink\" type=\"url\" placeholder=\"https://teams.microsoft.com/meet/...\" autocomplete=\"off\" maxlength=\"1000\"><div class=\"hint\">Use the company's confirmed meeting link. It will be clickable in the email.</div></div>\n          <div class=\"field-row\">\n            <div class=\"field\"><label for=\"finalMeetingId\">Meeting ID (if provided)</label><input id=\"finalMeetingId\" type=\"text\" autocomplete=\"off\" maxlength=\"120\" placeholder=\"Meeting ID\"></div>\n            <div class=\"field\"><label for=\"finalPasscode\">Passcode (if provided)</label><input id=\"finalPasscode\" type=\"text\" autocomplete=\"off\" maxlength=\"120\" placeholder=\"Passcode\"></div>\n          </div>\n          <div class=\"hint\">Candidate name, interview date and time are required, plus either a meeting link or Meeting ID. The readiness checklist is included automatically.</div>\n        </div>\n        <div id=\"faceToFaceFields\" class=\"hidden\">\n          <div class=\"hint\" style=\"margin:-2px 0 13px;\">This confirmation is addressed to the hiring company. The weekday is calculated automatically from the interview date.</div>\n          <div class=\"field-row\"><div class=\"field\"><label for=\"f2fDate\">Interview date <span class=\"required\">*</span></label><input id=\"f2fDate\" type=\"date\"></div><div class=\"field\"><label for=\"f2fTime\">Interview time <span class=\"required\">*</span></label><input id=\"f2fTime\" type=\"time\"></div></div>\n          <div class=\"field\"><label for=\"f2fVenue\">Face-to-face interview venue / full address <span class=\"required\">*</span></label><textarea id=\"f2fVenue\" rows=\"3\" maxlength=\"600\" placeholder=\"e.g. 708, City Avenue M Building, Mumbai-Bangalore Highway, Wakad, Pune, Maharashtra 411057\"></textarea></div>\n        </div>\n        <div id=\"nextScheduleFields\" class=\"hidden\">\n          <div class=\"field-row\"><div class=\"field\"><label for=\"nextDate\">Confirmed next-round date</label><input id=\"nextDate\" type=\"date\"></div><div class=\"field\"><label for=\"nextTime\">Next-round time</label><input id=\"nextTime\" type=\"time\"></div></div>\n        </div>\n        <div id=\"joiningFields\" class=\"hidden\">\n          <div class=\"field\"><label for=\"joiningDate\">Confirmed joining date</label><input id=\"joiningDate\" type=\"date\"><div class=\"hint\">Leave blank if the employer has not confirmed the date.</div></div>\n        </div>\n        <div class=\"section-line\"></div>\n        <div class=\"mini-heading\">Sender &amp; personal touch</div>\n        <div class=\"field-row\"><div class=\"field\"><label for=\"recruiterName\">Recruiter name</label><input id=\"recruiterName\" type=\"text\" placeholder=\"Team Jobmitra\" maxlength=\"100\"></div><div class=\"field\"><label for=\"recruiterPhone\">Contact number</label><input id=\"recruiterPhone\" type=\"tel\" placeholder=\"Optional\" maxlength=\"35\"></div></div>\n        <div class=\"field\"><label for=\"personalNote\">Additional note (optional)</label><textarea id=\"personalNote\" maxlength=\"750\" placeholder=\"e.g. Please keep your ID and updated resume ready.\"></textarea><div class=\"hint\">Appears in a separate note block. No private notes should be added accidentally.</div></div>\n        \n        <div class=\"form-actions\"><button type=\"button\" class=\"secondary-btn\" id=\"sampleBtn\">Load demo details</button><button type=\"button\" class=\"secondary-btn\" id=\"clearBtn\">Clear all</button></div>\n      </div>\n    </aside>\n    <section class=\"preview-pane\">\n      <div class=\"preview-top\"><div><h2>Live email preview</h2><p>Branded HTML formatting, ready for Gmail.</p></div><div class=\"preview-actions\"><button class=\"secondary-btn\" id=\"downloadBtn\" type=\"button\">↓ Download HTML</button><button class=\"primary-btn\" id=\"copyEmailBtn\" type=\"button\">⧉ &nbsp;Copy Formatted Email</button></div></div>\n      <div class=\"recipient-row\">\n      <label class=\"recipient-label\" for=\"recipientEmail\" id=\"recipientEmailLabel\">TO · Candidate</label>\n      <input id=\"recipientEmail\" class=\"recipient-input\" type=\"email\" inputmode=\"email\" autocomplete=\"email\" maxlength=\"254\" placeholder=\"Candidate email — fetched when linked to profile\" aria-describedby=\"recipientEmailHelp\">\n      <button id=\"copyRecipientBtn\" class=\"secondary-btn compact-btn\" type=\"button\">Copy To</button>\n    </div>\n    <div class=\"recipient-help warning\" id=\"recipientEmailHelp\" role=\"status\" aria-live=\"polite\">No candidate email available in this standalone preview. Enter it manually or open the Studio from Candidate Desk.</div>\n    <div class=\"company-contact-panel hidden\" id=\"companyContactPanel\">\n      <label for=\"companyContactSelect\">Company contact</label>\n      <select id=\"companyContactSelect\"><option value=\"\">Choose a contact from Company Details</option></select>\n    </div>\n    <div class=\"subject-row\"><label class=\"subject-label\" for=\"emailSubject\">Subject · editable</label><input id=\"emailSubject\" type=\"text\" maxlength=\"200\" aria-label=\"Editable email subject\" placeholder=\"Email subject\" autocomplete=\"off\"><button class=\"secondary-btn compact-btn\" id=\"resetSubjectBtn\" type=\"button\">Reset subject</button><button class=\"secondary-btn compact-btn\" id=\"copySubjectBtn\" type=\"button\">Copy subject</button></div>\n      <div class=\"preview-well\"><div class=\"email-paper\" id=\"emailBody\" aria-label=\"Generated email preview\"></div></div>\n      <div class=\"preview-foot\"><span><b>How to use:</b> Copy subject → paste into Gmail subject. Copy formatted email → paste into Gmail body.</span><span>Always review before sending.</span></div>\n    </section>\n  </main>\n  <p class=\"note\"><strong>Privacy &amp; delivery:</strong> This HTML app runs locally on your computer and does not upload candidate information. It does not send emails. The employee must check the candidate's status and details, then send manually from Gmail. <strong>Round completed</strong> and <strong>round cleared</strong> are deliberately different statuses.</p>\n  <div id=\"toast\" class=\"toast\" role=\"stat >${role}</strong>. Congratulations on this achievement!`,statusLabel:'Selection Confirmed',statusSubline:'Recruitment Facilitated by Jobmitra',\n            details:[...basic,...(confirmedJoining?[{label:'Confirmed joining date',value:escapeHtml(confirmedJoining)}]:[])],\n            body:'The Jobmitra team will coordinate the next steps with you. Please look out for formal offer, documentation and joining instructions from the hiring company or through our team. Any terms of employment should be verified against the employer’s official offer.',\n            next:'It has been a pleasure supporting your hiring journey. We wish you the very best as you move forward.'};break;\n        case 'offer_received':\n          content = {subject:`Offer Update | ${get('jobPosition')||'[Position]'} — ${get('companyName')||'[Company]'}`,\n            eyebrow:'OFFER UPDATE',title:'Congratulations on your offer!',sub:'Please review your offer details carefully.',\n            intro:`Congratulations! An offer for the <strong>${role}</strong> position with <strong>${company}</strong> has been shared as part of your hiring process.`,statusLabel:'Offer Shared / Received',\n            details:[...basic,...(confirmedJoining?[{label:'Confirmed joining date',value:escapeHtml(confirmedJoining)}]:[])],\n            body:'Please review the employer’s official offer carefully, including the role, compensation, documents required, location and joining terms. Confirm acceptance or raise any questions using the instructions provided by the hiring company.',\n            next:'Jobmitra is here to assist you with recruitment coordination and any clarification needed before joining.'};break;\n        case 'joined':\n          content = {subject:`Congratulations on Your New Beginning! | ${get('companyName')||'[Company]'}`,\n            eyebrow:'NEW BEGINNING',title:'Wishing you success in your new role!',sub:'Congratulations on reaching this career milestone.',\n            intro:`Congratulations on starting your new professional journey as <strong>${role}</strong> with <strong>${company}</strong>!`,statusLabel:'Joined Successfully',\n            details:[...basic,...(confirmedJoining?[{label:'Date of joining',value:escapeHtml(confirmedJoining)}]:[])],\n            body:'We are glad to have supported you through the recruitment process. We hope your new role brings meaningful opportunities, learning and growth.',\n            next:'Thank you for trusting Jobmitra during your job search. Wishing you a fulfilling and successful career ahead.'};break;\n        case 'not_selected':\n          content = {subject:`Application Update | ${get('jobPosition')||'[Position]'} | Jobmitra`,\n            eyebrow:'APPLICATION UPDATE',title:'Thank you for your time and interest',sub:'An update on your recent application.',\n            intro:`Thank you for the interest and effort you have shown during the recruitment process for the <strong>${role}</strong> opportunity.`,statusLabel:'Not Selected for This Role',details:[{label:'Position',value:role}],\n            body:'After reviewing the requirements for this particular role, we regret to inform you that your application will not be progressing further at this time. This decision relates only to the current opportunity.',\n            next:'We appreciate the time you invested and would be glad to consider your profile for future openings that match your skills and preferences. With your permission, the Jobmitra team may contact you when suitable opportunities become available. Thank you for staying connected with us.',hideReview:true};break;\n        default: throw new Error('Unknown email status');\n      }\n      const companyInvitation=['interview_scheduled','technical_interview','custom_round'].includes(status);\n      const confirmedNextInterview=['round1_cleared','round2_cleared'].includes(status) && Boolean(confirmedNext);\n      if(companyInvitation || confirmedNextInterview){\n        // The technical round uses a de rif;font-size:13px;font-weight:bold;color:#22303b;padding:11px 16px;border-bottom:1px solid #edf0f2;background:${bg};vertical-align:top;\">${value}</td></tr>`;\n    }\n    function makeEmailHTML(data,content) {\n      const sender = val('recruiterName','Team Jobmitra');\n      const phone = get('recruiterPhone')?`<span style=\"font-size:12px;color:#687583\">Contact: ${escapeHtml(get('recruiterPhone'))}</span><br>`:'';\n      const greeting = content.greeting || (content.recipient==='company' ? `Hi <strong>${data.company}</strong>,` : `Dear <strong>${data.name}</strong>,`);\n      const customNote = get('personalNote');\n      const noteHtml = customNote ? `<tr><td style=\"padding:1px 37px 18px 37px;\"><table width=\"100%\" cellpadding=\"0\" cellspacing=\"0\" role=\"presentation\" style=\"border-collapse:collapse;\"><tr><td style=\"background-color:#f7f8fa;border-left:3px solid #dd0000;padding:13px 15px;font-family:Arial,sans-serif;font-size:13px;line-height:1.75;color:#4b5968;\"><strong style=\"color:#263441;\">Additional note:</strong><br>${escapeHtml(customNote).replace(/\\n/g,'<br>')}</td></tr></table></td></tr>`:'';\n      const reviewHtml = content.recipient==='company' || content.hideReview ? '' : `<tr><td style=\"padding:8px 37px 28px 37px;\"><table width=\"100%\" role=\"presentation\" cellspacing=\"0\" cellpadding=\"0\" style=\"border-collapse:collapse;\"><tr><td style=\"padding:23px 23px 25px;background-color:#fff9f9;border:1px solid #f0dada;text-align:center;\"><p style=\"font-family:Arial,sans-serif;font-size:15px;line-height:1.5;color:#263441;margin:0 0 7px;font-weight:bold;\">We'd value your feedback</p><p style=\"font-family:Arial,sans-serif;font-size:12px;line-height:1.8;color:#606b78;margin:0 0 19px;\">If you would like, share an honest review of your Jobmitra experience. Your feedback is entirely optional and does not affect your application.</p><a href=\"${REVIEW_URL}\" target=\"_blank\" style=\"font-family:Arial,sans-serif;background-color:#dd0000;color:#ffffff;text-decoration:none;padding:12px 20px;display:inline-block;font-size:13px;font-weight:bold;border-radius:5px;\">★ &nbsp; Write a Google Review</a></td></tr></table></td></tr>`;\n      const stageBodyHtml = content.customBodyHtml || `<tr><td style=\"padding:0 37px;\"><p style=\"font-family:Arial,sans-serif;font-size:13px;color:#44515e;line-height:1.85;margin:0 0 14px;\">${content.body}</p><p style=\"font-family:Arial,sans-serif;font-size:13px;color:#44515e;line-height:1.85;margin:0 0 25px;\">${content.next}</p></td></tr>`;\n      const footerInfo = content.footerText || (content.recipient==='company'\n        ? 'This message confirms interview coordination details communicated by Jobmitra. Please notify us of changes to the schedule or interview location.'\n        : 'This message is from Jobmitra, a recruitment facilitator. Hiring decisions, employment terms and official offers are determined by the hiring company. If you have any questions, please reply to this email.');\n      const footerHtml = content.hideFooter ? '' : `<tr><td bgcolor=\"#f7f8fa\" style=\"background-color:#f7f8fa;padding:19px 37px;border-top:1px solid #e9ecef;\"><p style=\"font-family:Arial,sans-serif;color:#7a858f;font-size:11px;line-height:1.7;margin:0;\">${footerInfo}</p><p style=\"font-family:Arial,sans-serif;color:#9aa4ac;font-size:10px;margin:10px 0 0;\">Jobmitra · Your online job friend · Indore, Madhya Pradesh</p></td></tr>`;\n      return `<table width=\"100%\" cellspacing=\"0\" cellpadding=\"0\" role=\"presentation\" bgcolor=\"#f4f5f7\" style=\"margin:0;background-color:#f4f5f7;border-collapse:collapse;width:100%;font-family:Arial,Helvetica,sans-serif;\"><tr><td align=\"center\" style=\"padding:26px 13px;\"><table width=\"600\" cellspacing=\"0\" cellpadding=\"0\" role=\"presentation\" bgcolor=\"#ffffff\" style=\"border-collapse:collapse;background-color:#ffffff;width:100%;max-width:600px;border:1px solid #e6e9ed;\">\n      <tr><td bgcolor=\"#ffffff\" align=\"center\" st     function showModal({title,description,items,confirmLabel='Confirm',onConfirm}){modalCallback=onConfirm;el('modalHost').innerHTML=`<div class="modal-shade" role="presentation"><div class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="modal-header"><h3>${esc(title)}</h3><p>${esc(description||'')}</p></div><div class="modal-body"><div class="modal-items">${items.map(x=>`<div class="modal-line">${svg('check')}<div><strong>${esc(x.title)}</strong><br/><span style="color:#8290a1">${esc(x.text)}</span></div></div>`).join('')}</div><div class="review-tip" style="margin-top:20px">${svg('shield',13)} Saving is local to this browser. This prototype does not update real candidate journeys or production data.</div></div><div class="modal-footer"><button class="btn secondary" id="cancelModal">Cancel</button><button class="btn primary" id="confirmModal">${esc(confirmLabel)}</button></div></div></div>`;el('confirmModal').focus()}

    function saveDetails(){const err=validateDetails();if(err){toast(err,'error');return}const wasNew=isNew;if(isNew){const n=Math.max(248,...state.jobs.map(j=>Number(String(j.id).replace(/\D/g,''))||0))+1;selectedId='JD-'+String(n).padStart(4,'0');draft.id=selectedId;draft.createdAt=new Date().toISOString();draft.events=[{type:'JD created',info:draft.title+' · '+draft.company+' · target '+dateLabel(draft.targetDate),time:now()}];state.jobs.push(clone(draft));isNew=false}else{const saved=getSaved();for(const k of [...detailKeys,'qualification'])saved[k]=draft[k];saved.events.unshift({type:'JD details updated',info:'Job requirement fields edited'+(saved.targetDate?' · target '+dateLabel(saved.targetDate):''),time:now()})}draft.events=clone(getSaved().events);persist();render();toast(wasNew?'New JD created. Set status to Active to begin recruitment.':'JD details saved locally.');}

    function renderPlacement(){const placed=draft.candidates.filter(c=>['SELECTED','JOINED'].includes(stageOf(c)));el('workspace').innerHTML=`<div class="enquiry-banner"><div><div class="eyebrow">03 · AFTER SELECTION</div><h2>Placement & Billing</h2><p class="subtitle">Track offer, joining, 15-day follow-up, invoice and payment separately for every selected candidate.</p></div><span class="pill grey">${placed.length} selected or joined</span></div>${!placed.length?'<section class="card"><div class="card-body"><div class="empty-state"><strong>No selected candidates yet</strong>Once a candidate is selected by the company, placement tasks will appear here.</div></div></section>':`<div class="placement-grid">${placed.map(c=>{const m=placementStatus(c),join=joinedAt(c),due=join?new Date(Date.parse(join)+15*86400000).toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'}):'After confirmed joining';return `<section class="placement-card"><div class="placement-head"><div><h3>${esc(c.name)}</h3><small>${esc(candidateStage(c))} · ${esc(draft.title)}</small></div><button type="button" class="btn secondary small" data-view-candidate="${esc(c.id)}">View journey</button></div><div class="review-tip" style="margin-top:12px">15-day follow-up due: <b>${esc(due)}</b>. Confirm joining explicitly; selection is not joining.</div>${milestoneDefs.map(([key,label])=>`<div class="milestone-row"><div><strong>${esc(label)}</strong><small>${esc(m[key]||'PENDING')}</small></div><button type="button" class="btn secondary small" data-milestone="${key}" data-candidate-id="${esc(c.id)}">Update</button></div>`).join('')}${stageOf(c)==='SELECTED'?`<button class="btn primary full" style="margin-top:12px" type="button" data-confirm-joined="${esc(c.id)}">Confirm candidate joined</button>`:''}</section>`}).join('')}</div>`}<p class="pipeline-note" style="margin-top:17px">All milestones are manual records in this prototype. No letters/emails/invoices are actually sent and no money is collected.</p>`;}
    function showMilestoneAction(cid,key){const c=draft.candidates.find(x=>x.id===cid);if(!c)return;const labels=Object.fromEntries(milestoneDefs),m=placementStatus(c);const options=key==='payment'?['PENDING','RECEIVED','PARTIAL','CLOSED']:key==='invoice'?['PENDING','SENT','CANCELLED']:key==='offer'?['PENDING','SENT','ACCEPTED','DECLINED']:key==='onboarding'?['PENDING','IN_PROGRESS','COMPLETED']:['PENDING','DUE','COMPLETED'];el('modalHost').innerHTML=`<div class="modal-shade"><div class="modal" role="dialog" aria-modal="true" aria-label="Update placement milestone"><div class="modal-header"><h3>${esc(labels[key]||key)}</h3><p>${esc(c.name)} · ${esc(draft.title)}</p></div><div class="modal-body"><div class="field"><label for="milestoneValue">Status</label><select class="control" id="milestoneValue">${options.map(x=>`<option value="${x}" ${m[key]===x?'selected':''}>${esc(x.replaceAll('_',' '))}</option>`).join('')}</select></div><div class="field" style="margin-top:15px"><label for="milestoneNote">Note (optional)</label><textarea id="milestoneNote" class="control" placeholder="Details of the communication or confirmation"></textarea></div><p class="field-note">The recorded action does not send documents or payments.</p></div><div class="modal-footer"><button class="btn secondary" type="button" id="cancelModal">Cancel</button><button class="btn primary" id="saveMilestone" type="button">Save status</button></div></div></div>`;el('saveMilestone').onclick=()=>{const from=m[key]||'PENDING',to=el('milestoneValue').value,feedback=el('milestoneNote').value.trim(),at=new Date().toISOString();if(from!==to||feedback){m[key]=to;ensureCandidateHistory(c);const ev={type:'MILESTONE',at,fromKey:stageOf(c),toKey:stageOf(c),fromName:labels[key],toName:`${labels[key]} · ${to}`,feedback,feedbackSource:'Jobmitra',actor:'Demo recruiter',workflowVersion:draft.workflowVersion};c.journey.unshift(ev);const saved=getSaved();saved.candidates=clone(draft.candidates);recordJDEvent('Placement miles     function renderDashboard(){
      const jobs=[...state.jobs].sort((a,b)=>{const rank={overdue:0,due:1,track:2,unset:3,filled:4,closed:5};const r=rank[targetState(a).key]-rank[targetState(b).key];return r||String(a.targetDate||'9999').localeCompare(String(b.targetDate||'9999'));});

// JD history imports from older ATS versions use different stage keys.
// Translate keys for display only; never fabricate an action or interview event.
const STAGE_ALIASES={
  CANDIDATE_POOL:'POOL',POOL:'POOL',
  CANDIDATE_CONTACT:'CONTACT',CONTACT:'CONTACT',
  JOBMITRA_SCREENING:'SCREENING',SCREENING:'SCREENING',
  COMPANY_SUBMISSION:'COMPANY_SUBMISSION',
  COMPANY_INTERVIEW:'COMPANY_INTERVIEW',
  SELECTED_BY_COMPANY:'SELECTED',SELECTED:'SELECTED',
  JOINED:'JOINED',REJECTED:'NOT_SELECTED',NOT_SELECTED:'NOT_SELECTED'
};
function normalizedJDStage(k,rounds=[]){
  const raw=String(k||'').trim();
  if(!raw)return null;
  if(raw.startsWith('ROUND:'))return raw;
  if(rounds.some(r=>r.id===raw))return 'ROUND:'+raw;
  return STAGE_ALIASES[raw.toUpperCase()]||raw;
}
const jdHistoryLabel=key=>({
  POOL:'Candidate Pool',CONTACT:'Candidate Contact',SCREENING:'Jobmitra Screening',
  COMPANY_SUBMISSION:'Company Submission',COMPANY_INTERVIEW:'Company Interview',
  SELECTED:'Selected by Company',JOINED:'Joined',NOT_SELECTED:'Not Selected'
}[normalizedJDStage(key)]||key||'Unknown stage');
const jdStageName=(key,rounds=[])=>{
  const normalized=normalizedJDStage(key,rounds);
  if(normalized?.startsWith('ROUND:'))return rounds.find(r=>r.id===normalized.slice(6))?.name||'Archived company round';
  return jdHistoryLabel(normalized);
};
function jdProgressHTML(record){
  const rounds=record.rounds||[];
  const seq=[['POOL','Pool'],['CONTACT','Contact'],['SCREENING','Screening'],['COMPANY_SUBMISSION','Submission'],
    ...rounds.filter(x=>x.active||String(record.stage)==='ROUND:'+x.id).map(r=>['ROUND:'+r.id,r.name])];
  // Legacy records can be at a non-specific company-interview stage.
  if(normalizedJDStage(record.stage,rounds)==='COMPANY_INTERVIEW')seq.push(['COMPANY_INTERVIEW','Company Interview']);
  seq.push(['SELECTED','Selected'],['JOINED','Joined']);
  const current=normalizedJDStage(record.stage,rounds);
  const rejection=normalizedJDStage(record.rejection?.stageKey||record.rejection?.fromKey,rounds);
  const stopped=current==='NOT_SELECTED',at=stopped?rejection:current;
  let last=seq.findIndex(x=>x[0]===at);
  if(last<0){
    const ev=(record.journey||[]).map(e=>normalizedJDStage(e.toKey||e.fromKey,rounds));
    const idxs=ev.map(k=>seq.findIndex(x=>x[0]===k)).filter(i=>i>=0);
    last=idxs.length?Math.max(...idxs):-1;
  }
  return `<div class="jd-track" aria-label="Recruitment progress for ${escapeHTML(record.title)}">${seq.map(([s,label],i)=>{
    const onStage=i===last,past=last>=0&&i<last,failed=onStage&&stopped;
    const cls=failed?'rejected':onStage?'current':past?'reached':'';
    const sub=failed?'Not selected here':onStage?'Current position':past?'Reached / passed':'Not reached';
    return `<div class="jd-track-stage ${cls}"><span class="jd-track-node">${failed?'×':past?'✓':onStage?'●':'·'}</span><b>${escapeHTML(label)}</b><small>${sub}</small></div>`;
  }).join('')}</div>${last<0?'<p class="profile-v9-muted">This older stage is not fully mapped; historical events are retained below.</p>':''}`;
}

// The document library is local to this browser and origin, not the Jobmitra backend.
const DOCUMENT_DB='jobmitra-candidate-document-library-v1';
const DOCUMENT_STORE='documents';
let documentDBPromise;
function openDocumentDB(){
  if(documentDBPromise)return documentDBPromise;
  documentDBPromise=new Promise((resolve,reject)=>{
    if(!window.indexedDB)return reject(new Error('Browser file storage is unavailable'));
    const req=window.indexedDB.open(DOCUMENT_DB,1);
    req.onupgradeneeded=()=>{const db=req.result;if(!db.objectStoreNames.contains(DOCUMENT_STORE))db.createObjectStore(DOCUMENT_STORE,{keyPath:'id'});};
    req.onsuccess=()=>resolve(req.result);
    req.onerror=()=>reject(req.error||new Error('Could not open browser document library'));
    req.onblocked=()=>reject(new Error('Browser document library is blocked by another tab'));
  }).catch(e=>{documentDBPromise=null;throw e;});
  return documentDBPromise;
}
async function storeCandidateDocument(candidateId,blob,name,kind){
  const db=await openDocumentDB();
  const id=candidateId+'-'+Date.now()+'-'+Math.random().toString(36).slice(2,12);
  const row={id,candidateId,kind,name:String(name||'document'),size:blob.size,mime:blob.type||'application/octet-stream',at:new Date().toISOString(),blob};
  await new Promise((resolve,reject)=>{
    const tx=db.transaction(DOCUMENT_STORE,'readwrite');
    tx.objectStore(DOCUMENT_STORE).put(row);
    tx.oncomplete=()=>resolve();tx.onerror=()=>reject(tx.error||new Error('Document write failed'));
    tx.onabort=()=>reject(tx.error||new Error('Document save aborted'));
  });
  return {documentId:row.id,name:row.name,size:row.size,at:row.at,stored:true};
}
async function readCandidateDocument(id){
  const db=await openDocumentDB();
  return new Promise((resolve,reject)=>{
    const tx=db.transaction(DOCUMENT_STORE,'readonly');
    const req=tx.objectStore(DOCUMENT_STORE).get(id);
    req.onsuccess=()=>resolve(req.result||null);
    req.onerror=()=>reject(req.error||new Error('Document read failed'));
  });
}
async function downloadCandidateDocument(id,candidateId){
  try{
    const record=await readCandidateDocument(id);
    if(!record||record.candidateId!==candidateId)throw new Error('Stored document not found for this candidate');
    const uri=URL.createObjectURL(record.blob);
    const a=window.document.createElement('a');a.href=uri;a.download=record.name;
    window.document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(uri),10000);
    toast('Download started from this browser document library.');
  }catch(err){toast('Unable to open document: '+err.message);}
}
async function validateOriginalDocument(file){
  if(!file||file.size<=0||file.size>10*1024*1024||!(/\.(pdf|docx)$/i.test(file.name)))throw new Error('Choose a PDF or DOCX file between 1 byte and 10 MB');
  const header=new Uint8Array(await file.slice(0,8).arrayBuffer());
  const pdf=file.name.toLowerCase().endsWith('.pdf');
  if(pdf){if(String.fromCharCode(...header.slice(0,5))!=='%PDF-')throw new Error('The selected PDF does not have a PDF file signature');}
  else{if(header[0]!==0x50||header[1]!==0x4b)throw new Error('The selected DOCX is not a ZIP-based document');}
  // The server must perform deeper signature/archive validation before accepting production uploads.
}
async function clearLocalDocumentLibrary(){
 const db=await openDocumentDB();
 await new Promise((resolve,reject)=>{
  const tx=db.transaction(DOCUMENT_STORE,'readwrite');
  tx.objectStore(DOCUMENT_STORE).clear();
  tx.oncomplete=()=>resolve();tx.onerror=()=>reject(tx.error||new Error('Could not clear documents'));
  tx.onabort=()=>reject(tx.error||new Error('Document clearing was aborted'));
 });
}

$('#companyPanel').innerHTML=html;$$('[data-status]',$('#companyPanel')).forEach(b=>b.onclick=()=>{state.placementStatus=b.dataset.status;save();renderCompany()});$('#placementSearch').oninput=e=>{state.placementQuery=e.target.value;save();let caret=e.target.selectionStart;renderPlacements(c);$('#placementSearch').focus();$('#placementSearch').setSelectionRange(caret,caret)};$$('[data-placement]').forEach(b=>b.onclick=()=>openPlacement(b.dataset.placement));$('#simulateSelection').onclick=()=>simulateSelection(c);$('#previewEligibility').onclick=()=>openCandidateSearch();}
function renderJDs(c){let placementForJd=id=>state.placements.filter(p=>p.jdId===id);$('#companyPanel').innerHTML=`<div class="panel-heading"><div><h3>Job requirements</h3><p>Existing JD records remain in JD Tracking. This tab gives company-level visibility.</p></div><button class="btn small-btn" id="showPoolSearch">Preview eligible candidates</button></div><div class="compact-stat-row"><div class="compact-stat"><strong>${c.jobs.length}</strong><small>Demo job requirements</small></div><div class="compact-stat"><strong>${c.jobs.filter(x=>x.status==='Active').length}</strong><small>Active</small></div><div class="compact-stat"><strong>${state.placements.filter(p=>p.companyId===c.id&&p.status==='SELECTED').length}</strong><small>Joining pending</small></div></div><div class="table-viewport"><table class="data-table" style="min-width:520px"><thead><tr><th>Job title</th><th>JD reference</th><th>Status</th><th>Confirmed joinings</th><th>Selected / pending</th></tr></thead><tbody>${c.jobs.map(j=>`<tr><td data-label="Job title"><strong>${esc(j.title)}</strong></td><td data-label="JD reference">${esc(j.id)} ${j.id.startsWith('JD-')?`<button type="button" class="row-link" data-open-unified-jd="${esc(j.id)}">Open →</button>`:''}</td><td data-label="Status"><span class="pill green">${esc(j.status)}</span></td><td data-label="Confirmed joinings">${placementForJd(j.id).filter(p=>p.status==='JOINED').length}</td><td data-label="Selected / pending">${placementForJd(j.id).filter(p=>p.status==='SELECTED').length}</td></tr>`).join('')}</tbody></table></div><div class="inline-hint">Production action: open the corresponding JD in JD Tracking. Company placements are written automatically when a candidate reaches Selected by Company.</div>`;$('#showPoolSearch').onclick=()=>openCandidateSearch();$$('[data-open-unified-jd]',$('#companyPanel')).forEach(b=>b.onclick=()=>window.JobmitraUnified?.openJD?.(b.dataset.openUnifiedJd));}
function renderCompanyDetails(c){$('#companyPanel').innerHTML=`<div class="panel-heading"><div><h3>Company details & contacts</h3><p>Existing Company Master fields remain available. Contact email can later prefill Email Studio.</p></div><span class="pill grey">Editable in this preview</span></div><form id="companyForm"><div class="details-grid"><div class="details-card"><h4>Company information</h4><div class="field"><label for="coName">Company name *</label><input id="coName" required value="${esc(c.name)}" maxlength="140"></div><div class="field"><label for="coPhone">General phone numbers</label><textarea id="coPhone" placeholder="One number per line">${esc(c.phone||'')}</textarea></div><div class="field"><label for="coAddress">Address line</label><input id="coAddress" value="${esc(c.address||'')}"></div><div class="contact-grid"><div class="field"><label for="coCity">City</label><input id="coCity" value="${esc(c.city||'')}"></div><div class="field"><label for="coState">State</label><input id="coState" value="${esc(c.state||'')}"></div></div><div class="field" style="margin-top:9px"><label for="coPostal">Postal code</label><input id="coPostal" value="${esc(c.postal||'')}"></div></div><div class="details-card"><div class="panel-heading"><h4 style="margin:0">Company contacts</h4><button class="btn small-btn" id="addContact" type="button">＋ Add contact</button></div><div id="contactsContainer"></div><div class="inline-hint">Contact email is optional. A primary contact can be used for candidate submission recipient prefill; the To field will remain editable.</div></div></div><div class="details-actions"><div><small class="empty-hint">Source IDs: ${esc(c.sourceId||'Not recorded')} · Browser preview only</small><div style="margin-top:6px"><button class="btn danger small-btn" id="deleteCompany" type="button">Delete company</button></div></div><div><button class="btn small-btn" id="cancelDetails" type="button">Cancel</button><button class="btn primary small-btn" type="subm let contacts=structuredClone(c.contacts);function drawContacts(){let dest=$('#contactsContainer');dest.innerHTML=contacts.length?contacts.map((ct,i)=>`<div class="contact-card" data-index="${i}"><div class="contact-name"><b>Contact ${i+1}</b><button type="button" class="btn ghost small-btn" data-remove="${i}">Remove</button></div><div class="contact-grid"><div class="field"><label>Contact name</label><input data-field="name" value="${esc(ct.name||'')}" placeholder="Name"></div><div class="field"><label>Designation</label><input data-field="title" value="${esc(ct.title||'')}" placeholder="HR Manager"></div><div class="field"><label>Email</label><input data-field="email" type="email" value="${esc(ct.email||'')}" placeholder="contact@example.com"></div><div class="field"><label>Phone numbers</label><input data-field="phone" value="${esc(ct.phone||'')}" placeholder="Optional"></div></div><label style="display:flex;gap:6px;margin-top:10px;color:#62748a;font-size:10px;align-items:center"><input data-field="primary" type="radio" name="primaryContact" value="${i}" ${ct.primary?'checked':''}> Primary email contact</label></div>`).join(''):'<div class="empty-hint">No contact recorded. Use Add contact to create one.</div>';$$('[data-remove]',dest).forEach(b=>b.onclick=()=>{collectContacts();contacts.splice(Number(b.dataset.remove),1);if(contacts.length&&!contacts.some(x=>x.primary))contacts[0].primary=true;drawContacts()});}
function collectContacts(){let rows=$$('.contact-card');if(!rows.length)return;contacts=rows.map((row,i)=>({name:row.querySelector('[data-field="name"]').value.trim(),title:row.querySelector('[data-field="title"]').value.trim(),email:row.querySelector('[data-field="email"]').value.trim(),phone:row.querySelector('[data-field="phone"]').value.trim(),primary:!!row.querySelector('[data-field="primary"]').checked}));}
drawContacts();$('#addContact').onclick=()=>{collectContacts();contacts.push({name:'',title:'',email:'',phone:'',primary:!contacts.some(x=>x.primary)});drawContacts()};$('#deleteCompany').onclick=()=>{if(c.jobs.length||state.placements.some(p=>p.companyId===c.id)){modal('Company record protected','Existing linked records are preserved','<div class="gate">This company has JD or placement history. Deletion is blocked in the preview to prevent loss of candidate records. Production may support an audited archive action.</div>');return;}if(!confirm('Delete this new demo company? This will not affect the live Company Master.'))return;state.companies=state.companies.filter(x=>x.id!==c.id);state.selectedCompany=state.companies[0]?.id||'';state.scope='all';state.tab='placements';save();renderScope();renderAnalytics();renderDirectory();renderCompany();toast('Unlinked demo company deleted.');};$('#cancelDetails').onclick=()=>renderCompany();$('#companyForm').onsubmit=e=>{e.preventDefault();collectContacts();let emails=contacts.map(x=>x.email).filter(Boolean);if(emails.some(x=>!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(x))){toast('Please correct the contact email address.');return;}let name=$('#coName').value.trim();if(!name)return;Object.assign(c,{name,phone:$('#coPhone').value,address:$('#coAddress').value,city:$('#coCity').value,state:$('#coState').value,postal:$('#coPostal').value,contacts});save();renderDirectory();renderScope();renderAnalytics();renderCompany();toast('Company details saved in local preview.');};}
function setTab(tab){state.tab=tab;save();renderCompany()}
function modal(title,sub,inner,footer){const root=$('#overlay');root.hidden=false;root.innerHTML=`<div class="dialog" role="dialog" aria-modal="true" aria-labelledby="modalHeading"><div class="dialog-head"><div><h2 id="modalHeading">${esc(title)}</h2><p>${esc(sub||'')}</p></div><button class="close-btn" data-close aria-label="Close dialog">✕</button></div><div class="dialog-content">${inner}</div><div class="dialog-footer">${footer||'<button class="btn" data-close type="button">Close</button>'}</div></div>`;$$('[data-close]',root).forEach(b=>b.onclick=closeModal);root.addEventListener('click',e=>{if(e.target===root)closeModal()},{once:true});root.querySelector('.close-btn').focus();}
function closeModal(){$('#overlay').hidden=true;$('#overlay').innerHTML=''}
function candidateGate(p){const overall=statusForCandidate(p.candidateId);return overall==='SELECTED'?'<div class="gate">This candidate is searchable, but <b>Attach to JD</b> is disabled while company selection is active. Release only if selection is cancelled or joining fails.</div>':overall==='JOINED'?'<div class="gate">Candidate is searchable but <b>not eligible for new JD pools</b> while placed. Historical applications are preserved.</div>':'<div class="gate green">Selection ended without joining. The candidate is searchable and eligible for new JD pools, provided no other active hold exists.</div>'}
function openPlacement(id){let p=state.placements.find(x=>x.id===id);if(!p)return;let c=company(p.companyId);let body=`<div class="kicker">Canonical candidate · ${esc(p.candidateId)}</div><h3 style="font-size:16px;margin:6px 0 4px">${esc(p.name)}</h3><div class="muted small">${esc(p.job)} · ${esc(c?.name||'Company')}</div><div class="detail-mini-grid"><div><small>Selected by company</small><b>${esc(formatDate(p.selected))}</b></div><div><small>Joined on</small><b>${esc(formatDate(p.joined))}</b></div><div><small>Candidate status</small><b>${esc(statusLabel[p.status])}</b></div><div><small>JD ID</small><b>${esc(p.jdId)}</b></div></div><div class="timeline-list"><div class="timeline-event"><span class="timeline-marker" style="background:#eaf3ff;color:#1d6fa5">1</span><div><b>Selected by company</b><span>${esc(formatDate(p.selected))} · recorded against company/JD association</span></div></div>${p.status==='JOINED'?`<div class="timeline-event"><span class="timeline-marker" style="background:#e1f7e9;color:#16734d">✓</span><div><b>Joining confirmed</b><span>${esc(formatDate(p.joined))} · counted in successful placements</span></div></div>`:p.status==='NOT_JOINED'?`<div class="timeline-event"><span class="timeline-marker" style="background:#fff0f1;color:#be3340">×</span><div><b>Selection closed — not joined</b><span>${esc(formatDate(p.closed))} · candidate released for new JD pools</span></div></div>`:'<div class="timeline-event"><span class="timeline-marker" style="background:#fff1d9;color:#a46a18">…</span><div><b>Joining confirmation pending</b><span>Candidate cannot be assigned to another JD pool</span></div></div>'}</div>${candidateGate(p)}`;
let foot=p.linkedFromJD?'<button class="btn" data-close>Close</button><button class="btn primary" id="openLinkedJD">Open JD Pipeline</button>':p.status==='SELECTED'?`<button class="btn" data-close>Close</button><button class="btn danger" id="notJoined">Mark not joined</button><button class="btn primary" id="markJoined">Confirm joined</button>`:`<button class="btn" data-close>Close</button><button class="btn primary" id="searchInDirectory">Preview candidate search</button>`;
modal('Candidate placement record','Stage events & candidate availability',body,foot);if(p.linkedFromJD){$('#openLinkedJD').onclick=()=>{closeModal();window.JobmitraUnified?.openJD?.(p.jdId)};return;}
if(p.status==='SELECTED'){$('#markJoined').onclick=()=>{let d=day;p.status='JOINED';p.joined=d;save();closeModal();renderAnalytics();renderDirectory();renderCompany();toast(`${p.name}: joining confirmed. Placement counted.`)};$('#notJoined').onclick=()=>{if(!confirm('Mark this selection as NOT JOINED? This releases the candidate for new JD pools while retaining history.'))return;p.status='NOT_JOINED';p.closed=day;save();closeModal();renderAnalytics();renderDirectory();renderCompany();toast(`${p.name}: selection closed; candidate is eligible again.`)}}else $('#searchInDirectory').onclick=()=>{closeModal();openCandidateSearch(p.candidateId)};}
function statusForCandidate(id){let rs=state.placements.filter(p=>p.candidateId===id&&!['NOT_JOINED','SELECTION_CLOSED'].includes(p.status));if(rs.some(p=>p.status==='JOINED'))return'JOINED';if(rs.some(p=>p.status==='SELECTED'))return'SELECTED';return'AVAILABLE';}
function candidateSearchList(){const demo=[...state.available,...state.placements.map(p=>({id:p.candidateId,name:p.name,title:p.job}))];return [...new Map(demo.map(c=>[c.id,c])).values()];}
function openCandidateSearch(initial=''){let body=`<div class="kicker">Candidate Search preview</div><div style="margin:7px 0 10px;font-size:11px;color:#75869a">Selected and placed candidates remain visible, but cannot be added to a new JD pool.</div><div class="field"><label for="candidateFind">Find a candidate</label><input id="candidateFind" placeholder="Search by candidate name" value="${esc(candidateSearchList().find(c=>c.id===initial)?.name||'')}"></div><div class="search-candidate-results" id="candidateResults"></div>`;modal('Candidate Search · Eligibility','Standalone preview of how pool restrictions will appear',body);const draw=()=>{let q=$('#candidateFind').value.toLowerCase().trim(),items=candidateSearchList().filter(x=>`${x.name} ${x.title}`.toLowerCase().includes(q));$('#candidateResults').innerHTML=items.slice(0,12).map(x=>{let status=statusForCandidate(x.id);return `<div class="search-candidate"><div><strong>${esc(x.name)}</strong><small>${esc(x.title)} · ${esc(x.id)}</small><div style="margin-top:6px"><span class="pill ${status==='JOINED'?'red':status==='SELECTED'?'amber':'green'}">${status==='JOINED'?'Placed · Not Eligible':status==='SELECTED'?'Selected · On Hold':'Available'}</span></div></div><button type="button" class="btn" data-preview-pool="${esc(x.id)}" ${status!=='AVAILABLE'?'disabled title="Candidate is not eligible for a new JD pool"':''}>Add to JD</button></div>`}).join('')||'<div class="blank-state">No matching candidate profiles.</div>';$$('[data-preview-pool]').forEach(b=>b.onclick=()=>toast('Eligible in prototype. Actual JD assignment happens in Candidate Desk.'))};$('#candidateFind').oninput=draw;draw();}
function simulateSelection(c){if(!c.jobs.length){modal('No active JD available','Create a JD before recording a selection','<div class="blank-state">Selection events must originate from an existing JD.</div>');return;}let candidates=candidateSearchList().filter(x=>statusForCandidate(x.id)==='AVAILABLE');let body=`<div class="gate green" style="margin-top:0;margin-bottom:14px"><b>Production rule:</b> this record is created automatically when a candidate is marked <b>Selected by Company</b> in JD Tracking. This button only simulates that event in this preview.</div><div class="field"><label for="selectCandidate">Eligible candidate</label><select id="selectCandidate">${candidates.map(p=>`<option value="${esc(p.id)}">${esc(p.name)} · ${esc(p.title)}</option>`).join('')}</select></div><div class="field"><label for="selectJD">Active job requirement</label><select id="selectJD">${c.jobs.map(j=>`<option value="${esc(j.id)}">${esc(j.title)}</option>`).join('')}</select></div><div class="field"><label>Selection date</label><input value="${esc(formatDate(day))}" disabled></div><div class="gate">After confirmation: company register updated, candidate still searchable, Add to JD blocked while selection is active.</div>`;
if(!candidates.length){modal('Simulate JD Selection','Demo only','<div class="blank-state">All candidates in this preview are already selected or placed.</div>');return;}
modal('Simulate JD Selection','Shows the automatic JD → Company register → Pool hold behavior',body,'<button class="btn" data-close>Cancel</button><button class="btn primary" id="confirmDemoSelection">Simulate selection</button>');$('#confirmDemoSelection').onclick=()=>{let cid=$('#selectCandidate').value,jid=$('#selectJD').value,person=candidates.find(p=>p.id===cid),job=c.jobs.find(j=>j.id===jid);if(!person||!job)return;let existing=state.placements.find(p=>p.candidateId===cid&&p.jdId===jid&&p.status==='SELECTED');if(existing){toast('This selection already exists.');return;}state.placements.unshift({id:'p-'+Date.now(),candidateId:cid,name:person.name,companyId:c.id,jdId:jid,job:job.title,selected:day,joined:'',status:'SELECTED'});save();closeModal();state.placementStatus='ALL';state.placementQuery='';renderAnalytics();renderDirectory();renderCompany();toast(`${person.name} added to company selection register. New JD pools blocked.`)};}
function addCompany(){modal('Add company','Company Master · local design preview',`<div class="field"><label for="newCompanyName">Company name *</label><input id="newCompanyName" maxlength="140" placeholder="Company name"></div><div class="field"><label for="newCompanyCity">City (optional)</label><input id="newCompanyCity" placeholder="City"></div>`,'<button class="btn" data-close>Cancel</button><button class="btn primary" id="createCompany">Create demo company</button>');$('#createCompany').onclick=()=>{let name=$('#newCompanyName').value.trim();if(name.length<2){toast('Please provide a company name.');return;}let id='co-'+Date.now();state.companies.unshift({id,name,city:$('#newCompanyCity').value.trim(),state:'',postal:'',address:'',phone:'',contacts:[],jobs:[]});state.selectedCompany=id;state.scope=id;state.tab='details';save();closeModal();renderScope();renderAnalytics();renderDirectory();renderCompany();toast('Company added to browser preview only.')}}
$$('[data-period]').forEach(b=>b.onclick=()=>{state.period=b.dataset.period;save();renderScope();renderAnalytics()});$('#analyticsCompany').onchange=e=>{state.scope=e.target.value;if(e.target.value!=='all')state.selectedCompany=e.target.value;save();renderAnalytics();renderDirectory();renderCompany()};$('#applyDates').onclick=()=>{let a=$('#dateFrom').value,b=$('#dateTo').value;if(!a||!b||a>b){$('#rangeError').textContent='Choose a valid date range.';return;}$('#rangeError').textContent='';state.from=a;state.to=b;save();renderAnalytics()};
$$('[data-tab]').forEach(b=>b.onclick=()=>setTab(b.dataset.tab));$('#companySearch').oninput=renderDirectory;$('#companyShowJDs').onclick=()=>setTab('jobs');$('#companyEdit').onclick=()=>setTab('details');$('#addCompany').onclick=addCompany;$('#resetDemo').onclick=()=>{if(!confirm('Reset only the fictional browser preview data? No live company or candidate records are affected.'))return;state=seed();save();$('#companySearch').value='';renderScope();renderAnalytics();renderDirectory();renderCompany();toast('Preview reset to sample data.')};root.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#overlay').hidden)closeModal()});

const normalizedCompanyName=name=>String(name||'').trim().toLocaleLowerCase('en-IN').replace(/\s+/g,' ');
function companyByName(name){const query=normalizedCompanyName(name);return state.companies.find(c=>normalizedCompanyName(c.name)===query||(c.oldNames||[]).some(n=>normalizedCompanyName(n)===query));}
function getContacts(name){const c=companyByName(name);return (c?.contacts||[]).filter(x=>x.email&&/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(x.email)).map((x,i)=>({name:x.name||'',email:x.email,is_primary:!!x.primary,id:c.id+':'+i}));}
function getEligibility(candidateId){const status=statusForCandidate(candidateId);return{status,blocked:status!=='AVAILABLE',reason:status==='JOINED'?'Candidate has confirmed joining. Searchable but not eligible for a new JD Candidate Pool.':status==='SELECTED'?'Candidate is selected by a company. New JD Pool placement is on hold until the selection is closed.':''};}
function refreshFromJD(){
 const source=window.JobmitraUnifiedJD?.getPlacementSnapshot?.()||[];
 let changed=false;
 for(const jd of source){
   if(!jd.id||!jd.company)continue;
   let c=companyByName(jd.company);
   if(!c){const id='linked-'+jd.id.replace(/[^a-zA-Z0-9-]/g,'');c={id,name:jd.company,city:'',state:'',postal:'',address:'',phone:'',sourceId:'JD_WORKSPACE_PREVIEW',contacts:[],jobs:[],linkedFromJD:true};state.companies.push(c);changed=true;}
   const oldJob=c.jobs.find(j=>j.id===jd.id);
   if(!oldJob){c.jobs.push({id:jd.id,title:jd.title,status:jd.status==='ACTIVE'?'Active':jd.status||'Unknown',linkedFromJD:true});changed=true;}
   else if(oldJob.title!==jd.title||oldJob.status!==(jd.status==='ACTIVE'?'Active':jd.status||'Unknown')){oldJob.title=jd.title;oldJob.status=jd.status==='ACTIVE'?'Active':jd.status||'Unknown';changed=true;}
   for(const person of jd.candidates||[]){
     if(!person.id)continue;
     const key='linked:'+jd.id+':'+person.id;
     const stage=person.stageKey;
     const previous=state.placements.find(p=>p.id===key);
     if(stage==='SELECTED'||stage==='JOINED'){
       const sel=(person.journey||[]).find(e=>e.toKey==='SELECTED')?.at?.slice(0,10)||'';
       const join=(person.journey||[]).find(e=>e.toKey==='JOINED')?.at?.slice(0,10)||'';
       const next=stage==='JOINED'?'JOINED':'SELECTED';
       if(!previous){state.placements.push({id:key,candidateId:person.id,name:person.name||person.id,companyId:c.id,jdId:jd.id,job:jd.title,selected:sel,joined:stage==='JOINED'?join:'',status:next,linkedFromJD:true});changed=true;}
       else{
         const update={name:person.name||previous.name,companyId:c.id,job:jd.title,selected:sel||previous.selected,joined:stage==='JOINED'?(join||previous.joined):previous.joined,status:previous.status==='JOINED'?'JOINED':next};
         for(const [k,v] of Object.entries(update))if(previous[k]!==v){previous[k]=v;changed=true;}
       }
     }else if(stage==='NOT_SELECTED'&&previous?.status==='SELECTED'){previous.status='SELECTION_CLOSED';previous.closed=(person.rejection?.at||'').slice(0,10)||day;previous.closureReason='JD marked Not Selected after prior selection';changed=true;}
   }
 }
 if(changed){save();renderScope();renderAnalytics();renderDirectory();renderCompany();}
 return {changed,linkedPlacements:state.placements.filter(p=>p.linkedFromJD).length};
}
function showCompany(idOrName){const c=company(idOrName)||companyByName(idOrName);if(!c)return false;state.selectedCompany=c.id;state.scope=c.id;state.tab='placements';save();renderScope();renderAnalytics();renderDirectory();renderCompany();return true;}
window.JobmitraUnifiedCompanies={refreshFromJD,getEligibility,getCompanies:()=>state.companies.map(c=>({id:c.id,name:c.name,jobs:c.jobs.map(j=>({id:j.id,title:j.title,status:j.status}))})),getContacts,showCompany,getPlacementRecords:()=>state.placements.map(p=>({...p}))};
renderScope();renderAnalytics();renderDirectory();renderCompany();refreshFromJD();
