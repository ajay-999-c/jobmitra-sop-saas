function dashboardRows(){let f=filters,q=f.q.toLowerCase().trim(),a=jobs.filter(j=>`${j.title} ${j.company} ${j.code} ${j.id} ${j.location} ${j.owner}`.toLowerCase().includes(q)&&(f.status==='All Statuses'||j.status===f.status)&&(f.company==='All Companies'||j.company===f.company)&&(f.target==='All Targets'||target(j)[0]===({'On Track':'On track','Due Soon':'Due soon',Overdue:'Target missed'}[f.target])));if(f.period==='Today')a=a.filter(j=>j.created===today);if(f.period==='This Week')a=a.filter(j=>j.created>='2026-11-23'&&j.created<=today);if(f.period==='This Month')a=a.filter(j=>j.created.startsWith('2026-11'));if(f.period==='This Year')a=a.filter(j=>j.created.startsWith('2026'));let invalid=f.period==='Custom Date Range'&&(!f.from||!f.to||f.from>f.to);if(f.period==='Custom Date Range')a=invalid?[]:a.filter(j=>j.created>=f.from&&j.created<=f.to);a.sort((a,b)=>f.sort==='Oldest First'?a.created.localeCompare(b.created)||a.id-b.id:f.sort.startsWith('Target')?(a.target||'9999').localeCompare(b.target||'9999')||b.id-a.id:f.sort.startsWith('Company')?a.company.localeCompare(b.company)||b.id-a.id:f.sort.startsWith('Job Title')?a.title.localeCompare(b.title)||b.id-a.id:b.created.localeCompare(a.created)||b.id-a.id);let pages=Math.max(1,Math.ceil(a.length/f.size));f.num=Math.min(f.num,pages);$('#dashboardRows').innerHTML=`<div class="tablewrap"><table><thead><tr><th>Job requirement</th><th>Assigned recruiter</th><th>Created</th><th>Target date</th><th>Joined / target</th><th>Deadline status</th><th></th></tr></thead><tbody>${a.slice((f.num-1)*f.size,f.num*f.size).map(j=>{let t=target(j);return `<tr class="jobrow" onclick="openJob(${j.id})"><td><strong>${esc(j.title)}</strong><div class="sub">${esc(j.company)} · ${esc(j.code)} · ${esc(j.status)}</div></td><td>${esc(j.owner||'Unassigned')}</td><td>${date(j.created)}</td><td>${date(j.target)}</td><td><strong>${joined(j)} / ${esc(j.vacancies||'Not set')}</strong></td><td>${badge(t[0],t[1])}</td><td><button class="link" onclick function pipeline(){let j=job(),ss=stages(j);if(!ss.some(s=>s.id===stage))stage='pool';$('#main').innerHTML=header()+`<div class="stagebox"><div class="stagecaption"><h2>Candidate Pipeline</h2><small>Card number: all reached · Awaiting: current work</small></div><div class="rail">${ss.map((s,i)=>`<button title="${esc(s.n)}" class="stage ${i>=4&&i<ss.length-2?'round':i>=ss.length-2?'outcome':''} ${stage===s.id?'chosen':''}" aria-pressed="${stage===s.id}" onclick="chooseStage('${s.id}')"><span class="stitle">${esc(s.n)}</span><b>${reach(j,s.id)}</b><small class="${pending(j,s.id)?'pending':''}">${pending(j,s.id)} awaiting</small></button>`).join('')}</div></div>${j.mode==='Unknown'?'<div class="notice">Company interview plan not confirmed. Advancement beyond Company Submission requires a saved workflow.</div>':''}<section class="panel"><div class="toolbar"><h2>${esc(stageName(j,stage))}</h2><span class="grow"></span>${stage==='pool'?`<input id="candidateSearch" aria-label="Search candidate database" type="search" value="${esc(cq)}" placeholder="Search name, email or job title..." oninput="cq=this.value;pipelineRows()"><button class="link" onclick="cq='';pipeline()">Clear</button>`:`<input id="candidateSearch" aria-label="Search linked candidates" type="search" value="${esc(cq)}" placeholder="Search linked candidates" oninput="cq=this.value;pipelineRows()"><select aria-label="Filter linked candidates" onchange="scope=this.value;pipelineRows()">${[['reached','All reached'],['here','At this stage'],['selected','Selected / Joined'],['closed','Not Selected / Not Joined']].map(([v,n])=>`<option value="${v}" ${scope===v?'selected':''}>${n}</option>`).join('')}</select>`}</div><div id="pipelineRows"></div></section>`;pipelineRows();requestAnimationFrame(()=>$('.stage.chosen')?.scrollIntoView({block:'nearest',inline:'nearest'}))}

function pipelineRows(){let j=job(),q=cq.trim().toLowerCase(),rows;if(stage==='pool'){rows=candidates.filter(c=>`${c.name} ${c.role} ${c.email} ${c.city}`.toLowerCase().includes(q));$('#pipelineRows').innerHTML=`<div class="tablewrap"><table><thead><tr><th>Candidate</th><th>Location</th><th>Experience</th><th>Expected CTC</th><th>Availability</th><th>Action</th></tr></thead><tbody>${rows.map(c=>{let m=member(c.id),ok=eligible(c)&&canEdit();return `<tr><td><button class="link" onclick="profile(${c.id})"><strong>${esc(c.name)}</strong></button><div class="sub">${esc(c.role)}</div></td><td>${esc(c.city)}</td><td>${esc(c.exp)}</td><td>${esc(c.ctc)}</td><td>${badge(m?'Already linked':ok?'Available':'Unavailable',ok&&!m?'green':'')}</td><td>${m?`<button onclick="chooseStage('${m.current}')">Open ${esc(stageName(j,m.current))} →</button>`:`<button class="primary" ${ok?'':'disabled'} onclick="attach(${c.id})">＋ Add to this JD</button>`}</td></tr>`}).join('')}</tbody></table></div>${rows.length?'':'<div class="empty">No matching candidates</div>'}<div class="footer">${rows.length} matching candidates <span>${j.members.length} linked to this JD</span></div>`;return}rows=j.members.filter(m=>m.reached.includes(stage)&&(scope==='reached'||scope==='here'&&!m.closed&&m.current===stage||scope==='selected'&&!m.closed&&['selected','joined'].includes(m.current)||scope==='closed'&&m.closed)&&cand(m.id).name.toLowerCase().includes(q)).sort((a,b)=>Number(b.current===stage&&!b.closed)-Number(a.current===stage&&!a.closed));let batch=stage==='submit';$('#pipelineRows').innerHTML=`${batch?`<div class="toolbar"><span class="muted">${checked.size} selected for company submission</span><span class="grow"></span><button class="primary" ${checked.size?'':'disabled'} onclick="composeSubmission()">Compose submission (${checked.size})</button></div>`:''}<div class="tablewrap"><table><thead><tr>${batch?'<th></th>':''}<th>Candidate</th><th>Current status</th><th>Latest feedback</th><th style="text-align:right">Actions</th></tr></thead><tbody>${rows.map(m=>{let c=cand(m.id),current=m.current===stage&&!m.closed,active=canMove(m),isJoined=m.current==='joined',next=stages(j)[stages(j).findIndex(s=>s.id===m.current)+1],canNext=active&&m.current!=='selected'&&next&&!(j.mode==='Unknown'&&m.current==='submit');return `<tr>${batch?`<td><input type="checkbox" aria-label="Include ${esc(c.name)}" ${checked.has(c.id)?'checked':''} onchange="if(this.checked)checked.add(${c.id});else checked.delete(${c.id});pipelineRows()"></td>`:''}<td><button class="link" style="text-align:left;padding:0" onclick="profile(${c.id})"><strong>${esc(c.name)}</strong></button><div class="sub">${esc(c.role)}</div></td><td>${m.closed?badge(m.closed,'red'):current&&!isJoined?badge('Awaiting action','amber'):badge('Stage completed','green')}<div class="sub">Current: ${esc(stageName(j,m.current))}</div></td><td class="muted">${esc(m.feedback[stage]||'No feedback recorded')}</td><td><div class="actionrow"><button onclick="email(${c.id})">Email</button>${canNext?`<button class="primary" onclick="move(${c.id},false)">Next Stage →</button>`:active&&m.current==='selected'?`<button class="primary" onclick="move(${c.id},false)">Confirm joining</button>`:''}${active&&!(j.mode==='Unknown'&&stage==='submit')?`<button onclick="move(${c.id},true)">Move to Stage</button>`:''}${active&&stage!=='selected'?`<button class="reject-visible" onclick="reject(${c.id})">Not Selected</button>`:active&&stage==='selected'?`<button class="reject-visible" onclick="reject(${c.id})">Close selection</button>`:''}<button aria-label="More actions for ${esc(c.name)}" onclick="rowMenu(event,${c.id})">···</button></div></td></tr>`}).join('')}</tbody></table></div>${rows.length?'':'<div class="empty"><strong>No candidates in this view</strong>Choose another stage or filter.</div>'}<div class="footer"><span>${rows.length} candidates</span><span>${scope==='reached'?'Includes previous stage completions':scope==='here'?'Currently at this stage':'Filtered history'}</span></div>`}
function attach(id){if(!ensureFresh())return;let j=job();if(!canEdit()||member(id)||!eligible(cand(id)))return;j.members.push(mkMember(id,'contact',j.rounds));addEvent(j,'Movement',cand(id).name+' added to JD and moved to Candidate Contact');chooseStage('contact');toast('Candidate added · Candidate Contact')}

function showModal(title,body,footer='',wide=false){$('#modal').innerHTML=`<div class="overlay" onclick="if(event.target===this)closeModal()"><section class="modal ${wide?'wide':''}" role="dialog" aria-modal="true" aria-label="${esc(title)}"><h2>${esc(title)}</h2><div class="modalbody">${body}</div><div class="modalfooter"><button onclick="closeModal()">Cancel</button>${footer}</div></section></div>`}function closeModal(){$('#modal').innerHTML=''}document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();closeMenu()}});

function move(id,direct){let j=job(),m=member(id),ss=stages(j),start=ss.findIndex(s=>s.id===m.current),dest=ss.slice(start+1);if(!canMove(m)||!dest.length||(j.mode==='Unknown'&&m.current==='submit'))return;if(j.mode==='Unknown')dest=dest.filter(s=>fixed.some(f=>f.id===s.id));if(!dest.length)return;if(!direct)dest=dest.slice(0,1);showModal(direct?'Move to Stage':m.current==='selected'?'Confirm joining':'Move candidate to next stage',`<div><strong>${esc(cand(id).name)}</strong><p class="sub">Current: ${esc(stageName(j,m.current))}</p></div><label class="field">Destination stage<select id="destination" onchange="moveFields(${id},${direct})">${dest.map(s=>`<option value="${s.id}">${esc(s.n)}</option>`).join('')}</select></label><div id="moveExtra"></div>`, `<button class="primary" onclick="confirmMove(${id},${direct})">${direct?'Confirm Move to Stage':'Confirm'}</button>`);moveFields(id,direct)}
function moveFields(id,direct){let j=job(),m=member(id),s=$('#destination').value,ss=stages(j),a=ss.findIndex(x=>x.id===m.current),b=ss.findIndex(x=>x.id===s);$('#moveExtra').innerHTML=`<div class="hint">${esc(ss.slice(a,b).map(x=>x.n).join(' → '))} will be marked Completed. No email or appointment is created.</div>${['selected','joined'].includes(s)&&!m.reached.includes('selected')?field('Actual company selection date','selectionDate','','date'):''}${s==='joined'?field('Actual joining date','joiningDate','','date')+noteField('Joining confirmation details','evidence'):''}${!direct&&!['selected','joined'].includes(s)?noteField('Feedback / notes (optional)','moveNote')+selectField('Feedback source (optional)','moveSource',['Not specified','Company / Interviewer','Jobmitra Screening','Candidate'],'Not specified'):''}`}
function confirmMove(id,direct){if(!ensureFresh())return;let j=job(),m=member(id),s=$('#destination').value,ss=stages(j),a=ss.findIndex(x=>x.id===m.current),b=ss.findIndex(x=>x.id===s);if(!canMove(m)||b<=a)return;let sel=$('#selectionDate'),join=$('#joiningDate');if(sel&&(!sel.value||sel.value>today)){toast('Enter actual selection date');return}if(join&&(!join.value||join.value>today||!$('#evidence').value.trim()||join.value<(sel?.value||m.selectedOn||''))){toast('Enter valid actual joining date and evidence');return}if(sel)m.selectedOn=sel.value;if(join){m.joinedOn=join.value;m.evidence=$('#evidence').value.trim()}if($('#moveNote')?.value.trim())m.feedback[m.current]=$('#moveNote').value.trim();let completed=ss.slice(a,b).map(s=>s.n);m.reached=[...new Set([...m.reached,...ss.slice(a,b+1).map(x=>x.id)])];m.current=s;addEvent(j,'Movement',cand(id).name+' moved to '+stageName(j,s),'Completed: '+completed.join(', '));closeModal();chooseStage(s);toast('Preview stage updated')}

function email(id){let c=cand(id),j=job(),t=stage==='submit'?templates[15]:stage.startsWith('r')?templates[5]:stage==='selected'?templates[11]:stage==='joined'?templates[13]:templates[0];showModal('Email Studio',`<div class="row between"><strong>${esc(c.name)} · ${esc(j.title)}</strong>${badge('Preview only')}</div><p class="sub">Hiring company: ${esc(j.company)} · Stage: ${esc(stageName(j,stage))}</p>${selectField('Email template','template',templates,t)}<label class="field" id="recipientLabel">${t===templates[15]||t===templates[16]?'Company recipient':'Candidate recipient'}<input id="recipientPreview" value="${t===templates[15]||t===templates[16]?'Company contact — resolved in existing composer':esc(c.email)}" readonly></label><div class="hint">The existing approved Email Studio opens here with canonical JD, round, recipient and candidate context. Company templates remain manual. This layout preview does not render or send the approved email.</div>`,`<button onclick="toast('No email sent — design preview')" disabled>Send Email</button>`,true);$('#template').addEventListener('change',()=>{let isCompany=[templates[15],templates[16]].includes($('#template').value);$('#recipientLabel').firstChild.textContent=isCompany?'Company recipient':'Candidate recipient';$('#recipientPreview').value=isCompany?'Company contact — resolved in existing composer':c.email;})}
function composeSubmission(){showModal('Candidate Submission',`<strong>${esc(job().company)} · ${esc(job().title)}</strong>${[...checked].map(id=>`<div>${esc(cand(id).name)}</div>`).join('')}<div class="hint">Existing company-facing composer opens with the checked profiles, serial numbers and company contact. Manual copy/download remains unchanged.</div>`,`<button disabled>Copy Formatted Email</button>`,true)}
function editor(){let f=formDraft,newJD=page==='create';$('#main').innerHTML=`<div class="forms"><div class="row between titlebar"><div><h1>${newJD?'Create JD':'Edit JD'}</h1>${!newJD?`<p class="sub">${esc(job().title)} · ${esc(job().company)}</p>`:''}</div><button onclick="nav('${newJD?'dashboard':'pipeline'}')">${newJD?'Back to dashboard':'Back to pipeline'}</button></div><form id="jdForm" onsubmit="event.preventDefault();saveJD()"><section class="panel"><div class="formgroup"><h2>Basic information</h2><div class="formgrid"><label class="field">Company *<input id="companySearch" placeholder="Search company" oninput="companyOptions(this.value)"><select id="company" required><option value="">Choose company</option>${options(companies,f.company)}</select></label>${field('Job title / working title *','title',f.title,'text','required maxlength="200"')}${field('JD target date *','target',f.target,'date','required')}${field('Work location','location',f.location)}${field('Vacancies','vacancies',f.vacancies,'number','min="1" max="100000" step="1" placeholder="Not set"')}${selectField('JD status','status',['Draft','Active','On hold','Closed'],f.status)}${selectField('Assigned recruiter','owner',recruiters,f.owner||'Unassigned')}${selectField('Work mode','work_mode',['Not specified','Office / On-site','Hybrid','Remote'],f.work_mode)}${field('Company contact (optional)','contact',f.contact)}${field('JD creation date · automatic','created',newJD?'Automatic on save':date(f.created),'text','readonly')}</div></div><details class="group" ${newJD?'':'open'}><summary>Requirements <span class="muted compact">· Optional</span></summary><div class="formgroup formgrid">${noteField('Requirement / company notes','notes',f.notes)}${field('Key skills · comma separated','skills',f.skills)}${field('Minimum experience (years)','exp_min',f.exp_min,'number','min="0" max="80" step="0.5"')}${field('Maximum experience (years)','exp_max',f.exp_max,'number','min="0" max="80" step="0.5"')}${field('Qualification (optional)','qualification',f.qualification)}</div></details><details class="group" ${newJD?'':'open'}><summary>Salary Budget <span class="muted compact">· Optional</span></summary><div class="formgroup formgrid">${selectField('Salary period','period',['Monthly','Annual'],f.period)}${selectField('Salary basis','basis',['Not specified','CTC / Total package','Gross','In-hand'],f.basis)}<div></div>${field('Minimum salary (₹)','salary_min',f.salary_min,'number','min="0" step="1"')}${field('Maximum salary (₹)','salary_max',f.salary_max,'number','min="0" step="1"')}</div></details><details class="group"><summary>Full Job Description <span class="muted compact">· Optional</span></summary><div class="formgroup">${noteField('Paste detailed JD if available','full',f.full)}</div></details></section><div class="savebar"><span class="grow muted">${newJD?'Company, title and target date are required.':'Workflow configuration is saved separately.'}</span><button type="button" onclick="nav('${page}')">Discard</button><button type="submit" class="primary">${newJD?'Create JD':'Save JD Details'}</button></div></form></div>`;let period=$('#period');period.dataset.previous=period.value;period.addEventListener('change',()=>{let factor=period.value==='Annual'?12:1/12;for(let id of ['salary_min','salary_max']){let el=$('#'+id);if(el.value!=='')el.value=Math.round(Number(el.value)*factor)}period.dataset.previous=period.value});}
function companyOptions(q){let e=$('#company'),val=e.value,arr=companies.filter(c=>c.toLowerCase().includes(q.toLowerCase().trim()));if(val&&!arr.includes(val))arr.unshift(val);e.innerHTML='<option value="">Choose company</option>'+options(arr,val)}
function saveJD(){if(!ensureFresh())return;let f={...formDraft},keys=['company','title','target','location','vacancies','status','owner','work_mode','contact','notes','skills','exp_min','exp_max','qualification','period','basis','salary_min','salary_max','full'];for(let k of keys)f[k]=$('#'+k).value.trim();if(!companies.includes(f.company)||!f.title||!f.target){toast('Choose company, title and target date');return}if(f.target<(page==='create'?today:f.created)){toast('Target date cannot precede creation date');return}for(let [a,b] of [['exp_min','exp_max'],['salary_min','salary_max']])if(f[a]!==''&&f[b]!==''&&Number(f[a])>Number(f[b])){toast('Minimum cannot exceed maximum');return}if(page==='create'){let id=Math.max(...jobs.map(j=>j.id))+1;let j={...f,id,created:today,code:'DEMO-'+id,rounds:[],retired:[],mode:'Unknown',version:0,members:[],events:[]};jobs.unshift(j);addEvent(j,'JD details','JD created');openJob(id)}else{let j=job();Object.assign(j,f,{members:j.members,events:j.events});addEvent(j,'JD details','JD details saved');nav('pipeline')}toast('Saved in preview only')}
function workflowIcon(i){const paths=['<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>','<path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6A19.79 19.79 0 0 1 2.12 4.2 2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72l.7 3.24a2 2 0 0 1-.57 2.11L8 10.33a16 16 0 0 0 6 6l1.26-1.25a2 2 0 0 1 2.11-.57l3.24.7A2 2 0 0 1 22 16.92Z"/>','<rect x="5" y="4" width="14" height="18" rx="2"/><path d="M9 4V2h6v2M9 10h6M9 14h6"/>','<path d="m22 2-7 20-4-9-9-4 20-7ZM22 2 11 13"/>'];return `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${paths[i]}</svg>`}
function workflow(){let j=job(),a=workflowDraft,hasHistory=j.members.some(m=>m.reached.some(s=>s.startsWith('r'))),dirty=JSON.stringify(a)!==JSON.stringify(j.rounds)||workflowMode!==j.mode||JSON.stringify(window.retiredDraft)!==JSON.stringify(j.retired);let modeLabels={Unknown:'Not confirmed yet',Direct:'Direct selection · no interview',Configured:'Custom / configured interview rounds'};let presets=`<div class="row presetrow">${[1,2,3].map(n=>`<button ${hasHistory?'disabled title="Existing interview history must be preserved"':''} onclick="preset(${n})">${n===1?'＋ 1 round':n+' rounds'}</button>`).join('')}</div>`;$('#main').innerHTML=header()+`<div class="workflow-form"><section class="panel"><div class="formgroup workflow-top"><div class="row between"><h2>Add / Remove Interview Rounds</h2><span class="locked-label">🔒 Standard process locked</span></div><p class="sub">Modify interview rounds without changing JD details or candidate results.</p></div><div class="formgroup"><h2 class="workflow-heading"><span class="stepnum">01</span> Standard Jobmitra Process</h2><div class="standard-flow">${fixed.map((s,i)=>`<div class="flow-step"><span class="flow-icon">${workflowIcon(i)}</span><strong>${esc(s.n)}</strong><small>${['Find & add','Reach out','Internal review','Client review'][i]}</small></div>`).join('')}</div></div><div class="formgroup"><div class="row between"><h2 class="workflow-heading"><span class="stepnum purple">02</span> Company Interview Process</h2><span class="round-count">${workflowMode==='Configured'?a.length:0} rounds</span></div><p class="sub workflow-help">Add, rename or reorder company interview rounds.</p><label class="field plan-field">Interview plan status<select aria-label="Interview plan status" onchange="changeMode(this.value)">${Object.entries(modeLabels).map(([v,n])=>`<option value="${v}" ${v===workflowMode?'selected':''}>${n}</option>`).join('')}</select></label>${workflowMode==='Unknown'?`<div class="plan-empty"><strong>Interview plan not confirmed</strong><p>Start sourcing candidates now. Configure rounds when the client shares the process.</p></div>${presets}`:workflowMode==='Direct'?`<div class="plan-empty"><strong>Direct selection · no interview</strong><p>Company Submission is followed by Selected by Company.</p></div>${presets}`:`${presets}<div class="round-list">${a.map((r,i)=>`<div class="roundrow"><strong>${i+1}</strong><input aria-label="Stage ${i+1} name" value="${esc(r.n)}" oninput="workflowDraft[${i}].n=this.value;markWorkflowDirty()"><select aria-label="Stage ${i+1} typical interview mode" onchange="workflowDraft[${i}].mode=this.value;markWorkflowDirty()">${options(['Flexible','Face-to-Face','Video / Online','Phone'],r.mode)}</select><div class="row"><button title="Insert before" ${a.length>=15?'disabled':''} onclick="insertRound(${i})">＋</button><button title="Move up" ${i===0?'disabled':''} onclick="reorder(${i},-1)">↑</button><button title="Move down" ${i===a.length-1?'disabled':''} onclick="reorder(${i},1)">↓</button><button ${j.members.some(m=>!m.closed&&m.current===r.id)?'disabled title="A candidate is currently at this round"':''} onclick="retireRound(${i})">Remove</button></div></div>`).join('')}</div><div style="margin-top:14px"><button ${a.length>=15?'disabled':''} onclick="insertRound(${a.length})">＋ Add final round</button></div>`}${window.retiredDraft.length?`<details class="group" style="margin-top:15px"><summary>Retired rounds · kept for history</summary>${window.retiredDraft.map((r,i)=>`<div class="row between" style="padding:9px 0">${esc(r.n)}<button onclick="restoreRound(${i})">Restore</button></div>`).join('')}</details>`:''}</div><div class="formgroup"><h2 class="workflow-heading"><span class="stepnum green">03</span> Standard Hiring Outcomes</h2><div class="row outcomes-flow"><span>Selected by Company</span><span>Joined</span></div></div></section><div class="savebar"><span class="grow muted" id="workflowDirty">${dirty?'Unsaved workflow changes':'✓ Workflow configuration saved'}</span><button id="discardWorkflow" ${dirty?'':'disabled'} onclick="nav('workflow')">Discard edits</button><button id="reviewBtn" class="primary" ${dirty?'':'disabled'} onclick="reviewWorkflow()">Review & Save Workflow</button></div></div>`}
function markWorkflowDirty(){$('#workflowDirty').textContent='Unsaved workflow changes';$('#reviewBtn').disabled=false;$('#discardWorkflow').disabled=false}function changeMode(v){if(v!=='Configured'&&job().members.some(m=>m.reached.some(s=>s.startsWith('r')))){toast('Existing interview history prevents this change in the preview');workflow();return}workflowMode=v;if(v==='Configured'&&!workflowDraft.length)workflowDraft=[{id:'r'+Date.now(),n:'Interview Round 1',mode:'Flexible'}];workflow()}
function preset(n){if(job().members.some(m=>m.reached.some(s=>s.startsWith('r'))))return;if(workflowDraft.length&&!confirm('Replace the draft interview rounds with this preset?'))return;workflowMode='Configured';workflowDraft=Array.from({length:n},(_,i)=>({id:'r'+Date.now()+'-'+i,n:'Interview Round '+(i+1),mode:'Flexible'}));workflow()}
function insertRound(i){if(workflowDraft.length>=15)return;workflowDraft.splice(i,0,{id:'r'+Date.now(),n:'New interview round',mode:'Flexible'});workflow()}
function reorder(i,d){let a=workflowDraft;if(i+d<0||i+d>=a.length)return;[a[i],a[i+d]]=[a[i+d],a[i]];workflow()}
function retireRound(i){let r=workflowDraft[i];if(job().members.some(m=>!m.closed&&m.current===r.id))return;workflowDraft.splice(i,1);if(job().rounds.some(s=>s.id===r.id))window.retiredDraft.push(r);workflow()}
function restoreRound(i){if(workflowDraft.length>=15)return;workflowMode='Configured';workflowDraft.push(window.retiredDraft.splice(i,1)[0]);workflow()}
function reviewWorkflow(){let names=workflowDraft.map(r=>r.n.trim());if(workflowMode==='Configured'&&(!names.length||names.some(n=>n.length<3||n.length>80)||new Set(names.map(n=>n.toLowerCase())).size!==names.length)){toast('Use unique round names of 3–80 characters');return}showModal('Review workflow changes',`<div><strong>Workflow version ${job().version+1}</strong><p class="sub">${esc(workflowMode)} interview plan</p></div><div class="hint">${fixed.map(s=>esc(s.n)).join(' → ')}${workflowMode==='Configured'?' → '+names.map(esc).join(' → '):''} → Selected by Company → Joined</div><p>${job().members.length} linked candidates. Existing current stages remain unchanged. Retired round history is preserved.</p>`,`<button class="primary" onclick="saveWorkflow()">Save workflow version</button>`)}
function saveWorkflow(){if(!ensureFresh())return;let j=job();j.rounds=clone(workflowDraft);j.mode=workflowMode;j.retired=clone(window.retiredDraft);j.version++;addEvent(j,'Workflow','Workflow version '+j.version+' saved');closeModal();nav('workflow');toast('Workflow saved in preview only')}
const milestones={'Offer letter':['PENDING','SENT','ACCEPTED','DECLINED'],'Onboarding':['PENDING','IN_PROGRESS','COMPLETED'],'15-day follow-up':['PENDING','DUE','COMPLETED'],'Invoice sent':['PENDING','SENT','CANCELLED'],'Payment received':['PENDING','RECEIVED','PARTIAL','CLOSED']};
function placement(){let j=job(),ms=j.members.filter(m=>!m.closed&&['selected','joined'].includes(m.current));$('#main').innerHTML=header()+`<div class="row between titlebar"><h2>Placement & Billing</h2><span class="muted">${ms.length} selected or joined</span></div>${ms.length?ms.map(m=>`<section class="panel"><div class="toolbar"><strong>${esc(cand(m.id).name)}</strong>${badge(stageName(j,m.current),'green')}<span class="grow"></span><button onclick="profile(${m.id})">View journey</button>${m.current==='selected'&&canEdit()?`<button class="primary" onclick="stage='selected';move(${m.id},false)">Confirm joining</button>`:''}</div><div class="tablewrap"><table><thead><tr><th>Milestone</th><th>Status</th><th>Note</th><th>Action</th></tr></thead><tbody>${Object.keys(milestones).map((k,i)=>`<tr><td>${esc(k)}</td><td>${badge(m.milestones[k]?.status||'PENDING')}</td><td>${esc(m.milestones[k]?.note||'—')}</td><td><button onclick="milestone(${m.id},${i})">Update</button></td></tr>`).join('')}</tbody></table></div><div class="footer">${m.joinedOn?'Joined: '+date(m.joinedOn)+' · Follow-up: '+new Date(new Date(m.joinedOn+'T12:00:00').getTime()+15*86400000).toLocaleDateString('en-GB'):'Joining not confirmed'}</div></section>`).join(''):'<section class="panel empty"><strong>No selected or joined candidates</strong>Placement milestones will appear here after selection.<div style="margin-top:15px"><button onclick="stage=\'selected\';nav(\'pipeline\')">Open Selected by Company →</button></div></section>'}<p class="muted compact">Manual status records only. No invoice, payment or email is executed by updating milestones.</p>`}
function milestone(id,i){let k=Object.keys(milestones)[i],m=member(id);showModal('Update placement milestone',`<strong>${esc(cand(id).name)} · ${esc(k)}</strong>${selectField('Status','milestoneStatus',milestones[k],m.milestones[k]?.status||'PENDING')}${noteField('Note (optional)','milestoneNote',m.milestones[k]?.note||'')}`,`<button class="primary" onclick="saveMilestone(${id},${i})">Save status</button>`)}function saveMilestone(id,i){if(!ensureFresh())return;let k=Object.keys(milestones)[i],status=$('#milestoneStatus').value;member(id).milestones[k]={status,note:$('#milestoneNote').value};addEvent(job(),'Placement',cand(id).name+' · '+k+' · '+status,$('#milestoneNote').value);closeModal();placement()}
function activity(){let j=job(),a=j.events.filter(e=>activityFilter==='All activity'||e.type===activityFilter);$('#main').innerHTML=header()+`<section class="panel timeline"><div class="toolbar"><h2>JD Activity</h2><span class="grow"></span><select aria-label="Activity type" onchange="activityFilter=this.value;activity()">${options(['All activity','Movement','Feedback','Interview','Email','JD details','Workflow','Placement'],activityFilter)}</select></div>${a.map(e=>`<div class="event"><div class="muted compact">${esc(e.date)}<div style="margin-top:6px">${badge(e.type)}</div></div><div><strong>${esc(e.title)}</strong><details><summary>Details</summary><pre>${esc(e.detail||'Recorded in preview')}</pre></details></div></div>`).join('')||'<div class="empty">No matching activity</div>'}</section>`}
function adjacent(n){showModal(n,`<p>The existing ${esc(n)} workspace remains available in the real Jobmitra application.</p><div class="hint">This standalone preview is intentionally limited to JD Tracking and its contextual entry points. It has no backend connection.</div>`)}

const syncKey='jobmitra-jd-audit-preview-v2';let seenSnapshot=null,storageOK=true,queuedUpdate=false;
function readDemo(){try{return localStorage.getItem(syncKey)}catch(e){storageOK=false;return null}}
function setSyncStatus(message,waiting=false){$('#syncStatus').textContent=message;$('#loadUpdates').classList.toggle('hide',!waiting)}
function persistDemo(){if(!storageOK)return;try{const data=JSON.stringify({revision:Date.now()+':'+Math.random(),jobs});localStorage.setItem(syncKey,data);seenSnapshot=data;queuedUpdate=false;setSyncStatus('Auto refresh · Demo synced')}catch(e){storageOK=false;setSyncStatus('Session-only preview')}}
function importDemo(raw){try{let data=JSON.parse(raw);if(!Array.isArray(data.jobs)||!data.jobs.length||data.jobs.some(j=>!Array.isArray(j.members)||!Array.isArray(j.rounds)))return false;jobs=data.jobs;seenSnapshot=raw;queuedUpdate=false;return true}catch(e){return false}}
function busyView(){return ['create','details','workflow'].includes(page)||!!$('#modal').children.length}
function refreshView(){let el=document.activeElement,key=el?.id,from=el?.selectionStart,to=el?.selectionEnd,scrollX=$('.rail')?.scrollLeft,sy=window.scrollY;if(jid&&!job()){jid=null;page='dashboard'}render();if(scrollX!=null&&$('.rail'))$('.rail').scrollLeft=scrollX;if(key&&document.getElementById(key)){let n=document.getElementById(key);n.focus({preventScroll:true});if(typeof from==='number')try{n.setSelectionRange(from,to)}catch(e){}}window.scrollTo(0,sy)}
function syncDemo(){let raw=readDemo();if(!storageOK){setSyncStatus('Session-only preview');return}if(!raw||raw===seenSnapshot)return;if(busyView()){queuedUpdate=true;setSyncStatus('Updates available · editing protected',true);return}if(importDemo(raw)){if(job())checked=new Set([...checked].filter(id=>member(id)));refreshView();setSyncStatus('Auto refresh · Demo synced')}}
function ensureFresh(){let raw=readDemo();if(storageOK&&raw&&raw!==seenSnapshot){queuedUpdate=true;setSyncStatus('Updates available · editing protected',true);toast('Another tab changed the demo. Load changes before saving.');return false}return true}
function applyUpdates(){let raw=readDemo();if(!raw||raw===seenSnapshot)return;if(busyView()&&!confirm('Load the latest demo records and discard any open edits?'))return;closeModal();if(importDemo(raw)){if(page==='create')page='dashboard';if(page==='details')formDraft=clone(job());if(page==='workflow'){workflowDraft=clone(job().rounds);workflowMode=job().mode;window.retiredDraft=clone(job().retired)}checked.clear();refreshView();setSyncStatus('Auto refresh · Demo synced')}}
function manualRefresh(){syncDemo();if(queuedUpdate){toast('Load changes when you are ready to discard open edits.');return}if(!busyView())refreshView();toast('Preview refreshed')}
let initialSnapshot=readDemo();if(initialSnapshot)importDemo(initialSnapshot);if(!seenSnapshot&&storageOK)persistDemo();if(!storageOK)setSyncStatus('Session-only preview');window.addEventListener('storage',e=>{if(e.key===syncKey)syncDemo()});window.addEventListener('focus',syncDemo);document.addEventListener('visibilitychange',()=>{if(!document.hidden)syncDemo()});setInterval(()=>{if(!document.hidden)syncDemo()},15000);

render();
</script></body></html>
